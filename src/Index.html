<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בית אור · שיבוץ שיעורים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6ee;
    --surface: #ffffff;
    --surface-2: #f4eee2;
    --ink: #1f2a44;
    --ink-2: #55607a;
    --ink-3: #8a90a0;
    --line: #e7dfcf;
    --gold: #c98a12;
    --gold-strong: #a86f05;
    --gold-soft: #fbefd3;
    --navy: #22335c;
    --navy-soft: #e8edf7;
    --mine: #fff4d9;
    --mine-line: #e8b440;
    --danger: #b3261e;
    --ok: #2e7d4f;
    --shadow: 0 1px 2px rgba(31,42,68,.06), 0 4px 16px rgba(31,42,68,.06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161f;
      --surface: #1a2030;
      --surface-2: #222a3c;
      --ink: #eef0f5;
      --ink-2: #b3b9c8;
      --ink-3: #7f879a;
      --line: #2e3850;
      --gold: #f0b440;
      --gold-strong: #f6c45f;
      --gold-soft: #3a3020;
      --navy: #9fb4e6;
      --navy-soft: #26324d;
      --mine: #3b3220;
      --mine-line: #c9962f;
      --danger: #ff8a80;
      --ok: #7fd3a0;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Heebo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  .top {
    background: var(--navy);
    color: #fff;
    background-image: radial-gradient(ellipse at 15% -40%, rgba(240,180,64,.45), transparent 60%);
  }
  @media (prefers-color-scheme: dark) { .top { background-color: #1b2540; } }
  .top .wrap { display: flex; align-items: center; gap: 14px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; }
  .brand svg { width: 46px; height: 46px; flex: none; }
  .brand h1 { margin: 0; font: 700 26px/1.1 "Frank Ruhl Libre", serif; letter-spacing: .3px; }
  .brand p { margin: 2px 0 0; opacity: .8; font-size: 14px; }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: #fff;
    border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px;
  }
  .pill:hover { background: rgba(255,255,255,.16); }
  .pill.on { background: #fff; color: var(--navy); border-color: #fff; }
  @media (prefers-color-scheme: dark) { .pill.on { color: #1b2540; } }

  .banner { background: var(--gold-soft); color: var(--ink); font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  main.wrap { padding-top: 22px; padding-bottom: 60px; }
  .intro { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; margin-bottom: 14px; color: var(--ink-2); }
  .intro strong { color: var(--ink); }

  /* My bookings */
  .mine-strip {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 18px; box-shadow: var(--shadow);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .mine-strip h2 { font-size: 14px; margin: 0; color: var(--ink-2); font-weight: 600; }
  .mine-chip {
    border: 1px solid var(--mine-line); background: var(--mine); border-radius: 10px;
    padding: 5px 10px; font-size: 13px; text-align: start;
  }
  .mine-chip b { font-weight: 600; }

  /* Week tabs */
  .tabs { display: flex; gap: 10px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .tab {
    flex: 1 0 200px; text-align: start; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); position: relative;
  }
  .tab .t-kicker { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .tab .t-title { font: 700 21px/1.2 "Frank Ruhl Libre", serif; margin: 2px 0; }
  .tab .t-sub { font-size: 13px; color: var(--ink-2); }
  .tab[aria-selected="true"] { border-color: var(--gold); background: linear-gradient(var(--gold-soft), var(--surface)); }
  .tab[aria-selected="true"]::after {
    content: ""; position: absolute; inset-inline: 16px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--gold);
  }

  /* Week grid */
  .grid {
    display: grid;
    grid-template-columns: 96px repeat(var(--days), minmax(0, 1fr));
    grid-template-rows: auto repeat(var(--lessons), minmax(92px, auto));
    gap: 8px;
  }
  .lesson-col, .day { display: grid; grid-row: 1 / -1; grid-template-rows: subgrid; gap: 8px; }
  .lesson-label {
    display: flex; flex-direction: column; justify-content: center; padding: 0 8px;
    color: var(--ink-2); border-inline-end: 2px solid var(--line);
  }
  .lesson-label strong { color: var(--ink); font-weight: 600; }
  .lesson-label span { font-size: 12px; }
  .day-head {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .day-name { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .day-date { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; }
  .heb { color: var(--gold-strong); font-weight: 500; }
  .badge { background: var(--gold); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 8px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .badge { color: #1a1300; } }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; background: var(--navy-soft); color: var(--navy); border-radius: 6px; padding: 1px 7px; }
  .day-note { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .is-today .day-head { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft), var(--shadow); }

  .slot {
    border-radius: 12px; padding: 9px 11px; min-width: 0; text-align: start; display: flex; flex-direction: column; gap: 2px;
    border: 1px solid var(--line); background: var(--surface); position: relative;
  }
  .slot-label { display: none; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .slot.free {
    border: 1.5px dashed var(--line); background: transparent; justify-content: center; align-items: center;
    color: var(--ink-3); transition: background .15s, border-color .15s, color .15s;
  }
  .slot.free:hover, .slot.free:focus-visible { border-color: var(--gold); color: var(--gold-strong); background: var(--gold-soft); outline: none; }
  .free-cta { font-weight: 600; font-size: 14px; }
  .slot.taken { background: var(--navy-soft); border-color: transparent; }
  .slot.taken .who { display: flex; flex-direction: column; min-width: 0; }
  .slot.taken strong { font-weight: 600; overflow-wrap: anywhere; }
  .slot .cls { font-size: 13px; color: var(--ink-2); }
  .slot .topic { font-size: 12px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .slot.mine { background: var(--mine); border-color: var(--mine-line); }
  .slot.mine::before {
    content: "שלי"; position: absolute; top: 6px; inset-inline-end: 8px; font-size: 10px; font-weight: 700;
    color: var(--gold-strong); letter-spacing: .5px;
  }
  .slot.empty { background: transparent; border-color: transparent; color: var(--ink-3); justify-content: center; align-items: center; }
  .is-locked .slot.empty { background: repeating-linear-gradient(-45deg, transparent 0 8px, var(--surface-2) 8px 10px); border-color: var(--line); }
  .is-past .slot.taken { opacity: .6; }
  .is-past .day-head, .is-closed .day-head { opacity: .75; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--danger); font-size: 12px; font-weight: 600; align-self: flex-start; margin-top: 2px; }
  .link-btn:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .grid { display: flex; flex-direction: column; gap: 14px; }
    .lesson-col { display: none; }
    .day { display: flex; flex-direction: column; gap: 6px; }
    .slot { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 52px; }
    .slot-label { display: block; flex: 0 0 64px; }
    .slot.free { justify-content: flex-start; }
    .slot.taken .who { flex-direction: row; gap: 8px; align-items: baseline; flex: 1; }
    .slot .topic { flex-basis: 100%; padding-inline-start: 74px; }
    .slot.empty { justify-content: flex-start; min-height: 40px; }
    .link-btn { margin-inline-start: auto; }
    .day.is-past { display: none; }
    .tab { flex-basis: 170px; }
  }

  /* Admin */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 4px; font: 700 22px/1.2 "Frank Ruhl Libre", serif; }
  .panel .muted { color: var(--ink-2); margin: 0 0 14px; font-size: 14px; }
  .admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .admin-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 500; }
  .admin-tabs button[aria-selected="true"] { background: var(--navy); color: #fff; border-color: var(--navy); }
  @media (prefers-color-scheme: dark) { .admin-tabs button[aria-selected="true"] { color: #12161f; } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > label { flex: 1 1 180px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  tr.inactive td { color: var(--ink-3); }
  td.num { font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; white-space: nowrap; }
  .link { border: 0; background: none; padding: 0; color: var(--navy); font-weight: 600; font-size: 13px; }
  .link.danger { color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--ink-2); }
  details summary { cursor: pointer; color: var(--navy); font-weight: 600; margin-top: 14px; }

  /* Forms & dialogs */
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
  input, select, textarea {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 15px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: -1px; border-color: transparent; }
  textarea { resize: vertical; min-height: 70px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; background: var(--surface-2); color: var(--ink); }
  .btn.primary { background: var(--gold); color: #fff; }
  .btn.primary:hover { background: var(--gold-strong); }
  @media (prefers-color-scheme: dark) { .btn.primary { color: #1a1300; } }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: .55; cursor: progress; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }
  .check input { width: auto; }

  dialog {
    border: 0; border-radius: 18px; padding: 0; width: min(460px, calc(100vw - 32px));
    background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(20,26,40,.45); }
  dialog form { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  dialog h3 { margin: 0; font: 700 22px/1.2 "Frank Ruhl Libre", serif; }
  .dlg-sub { margin: -8px 0 0; color: var(--ink-2); font-size: 14px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-start; margin-top: 4px; }
  .hint { font-size: 12px; color: var(--ink-3); font-weight: 400; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); color: #fff; }

  .loading { padding: 60px 0; text-align: center; color: var(--ink-3); }
  .empty-msg { color: var(--ink-3); padding: 18px 4px; }
  .footer { color: var(--ink-3); font-size: 12px; text-align: center; margin-top: 30px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.35)"/>
        <path d="M24 9c4 6 9 9.5 9 16.5a9 9 0 0 1-18 0c0-4 2-6.5 3.5-8 .3 3 1.8 4.6 3.4 5.2C21 18 22 13 24 9z" fill="#f0b440"/>
        <path d="M24 22c2 3 4 4.5 4 7.6a4 4 0 0 1-8 0c0-2.4 1.6-4.4 4-7.6z" fill="#fff6dc"/>
        <rect x="15" y="36" width="18" height="3" rx="1.5" fill="#fff" opacity=".85"/>
      </svg>
      <div>
        <h1 id="spaceName">בית אור</h1>
        <p>מרחב למידה · <span id="schoolName">בנות מנחם</span></p>
      </div>
    </div>
    <div class="top-actions">
      <button class="pill" id="whoBtn" type="button">בחירת מורה</button>
      <button class="pill" id="adminBtn" type="button">ניהול</button>
    </div>
  </div>
</header>
<div class="banner" id="previewBanner" hidden>
  <div class="wrap">מצב תצוגה מקדימה – הנתונים נשמרים רק בדפדפן הזה. קוד ניהול לדוגמה: 1234</div>
</div>

<main class="wrap">
  <div id="loading" class="loading">טוען את לוח השיבוצים…</div>

  <section id="scheduleView" hidden>
    <div class="intro" id="intro"></div>
    <div class="mine-strip" id="mineStrip" hidden></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="week"></div>
  </section>

  <section id="adminView" hidden></section>

  <p class="footer">בית אור · מרחב למידה משמעותית וחווייתית · בנות מנחם</p>
</main>

<!-- Booking dialog -->
<dialog id="bookDlg">
  <form method="dialog" id="bookForm">
    <h3>השתבצות לשיעור</h3>
    <p class="dlg-sub" id="bookSummary"></p>
    <label>שם המורה
      <select id="bTeacherSel" required></select>
      <input id="bTeacherTxt" maxlength="40" autocomplete="name" hidden>
    </label>
    <label id="bPinWrap" hidden>קוד אישי
      <input id="bPin" inputmode="numeric" autocomplete="off" maxlength="12">
    </label>
    <label>כיתה
      <input id="bClass" required maxlength="30" list="classList" placeholder="למשל: ה׳2">
      <datalist id="classList"></datalist>
    </label>
    <label>נושא / פעילות <span class="hint">(לא חובה)</span>
      <textarea id="bTopic" maxlength="120" placeholder="למשל: סדנת חושים לפרשת נח"></textarea>
    </label>
    <div class="dlg-actions">
      <button class="btn primary" id="bookSubmit" value="ok">שיבוץ</button>
      <button class="btn" value="cancel" formnovalidate>ביטול</button>
    </div>
  </form>
</dialog>

<!-- Who am I dialog -->
<dialog id="whoDlg">
  <form method="dialog" id="whoForm">
    <h3>מי את?</h3>
    <p class="dlg-sub">בחרי את שמך כדי לראות את השיבוצים שלך ולהשתבץ מהר יותר.</p>
    <label>שם המורה
      <select id="whoSel"></select>
      <input id="whoTxt" maxlength="40" hidden>
    </label>
    <div class="dlg-actions">
      <button class="btn primary" value="ok">שמירה</button>
      <button class="btn" value="cancel" formnovalidate>סגירה</button>
    </div>
  </form>
</dialog>

<!-- Admin login -->
<dialog id="adminDlg">
  <form method="dialog" id="adminForm">
    <h3>כניסה לניהול</h3>
    <label>קוד ניהול
      <input id="adminCode" type="password" inputmode="numeric" autocomplete="current-password" required>
    </label>
    <div class="dlg-actions">
      <button class="btn primary" value="ok">כניסה</button>
      <button class="btn" value="cancel" formnovalidate>ביטול</button>
    </div>
  </form>
</dialog>

<!-- Teacher edit -->
<dialog id="teacherDlg">
  <form method="dialog" id="teacherForm">
    <h3 id="teacherDlgTitle">מורה חדשה</h3>
    <label>שם מלא
      <input id="tName" required maxlength="40">
    </label>
    <label>קוד אישי <span class="hint">(לא חובה – אם יוגדר, המורה תתבקש להקליד אותו בהשתבצות, ותוכל לבטל מכל מכשיר)</span>
      <input id="tPin" inputmode="numeric" pattern="\d{3,12}" maxlength="12" autocomplete="off">
    </label>
    <label class="check"><input type="checkbox" id="tActive" checked> פעילה (מופיעה ברשימת המורות)</label>
    <div class="dlg-actions">
      <button class="btn primary" value="ok">שמירה</button>
      <button class="btn" value="cancel" formnovalidate>ביטול</button>
    </div>
  </form>
</dialog>

<!-- Confirm -->
<dialog id="confirmDlg">
  <form method="dialog">
    <h3 id="confirmTitle">אישור</h3>
    <p class="dlg-sub" id="confirmText"></p>
    <div class="dlg-actions">
      <button class="btn danger" value="ok" id="confirmOk">אישור</button>
      <button class="btn" value="cancel">חזרה</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- Utilities ---------- */
  const $ = (id) => document.getElementById(id);
  const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    sdel(k) { try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  function parseDate(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function addDays(s, n) { const d = parseDate(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dow(s) { return parseDate(s).getUTCDay(); }
  function fmtShort(s) { const d = parseDate(s); return d.getUTCDate() + '.' + (d.getUTCMonth() + 1); }

  function gematria(n) {
    if (n === 15) return 'ט״ו';
    if (n === 16) return 'ט״ז';
    const tens = ['', 'י', 'כ', 'ל'][Math.floor(n / 10)] || '';
    const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'][n % 10];
    const s = tens + ones;
    return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
  }
  let hebFmt = null;
  try { hebFmt = new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long', timeZone: 'UTC' }); } catch (e) { /* unsupported */ }
  function hebDate(s) {
    if (!hebFmt) return '';
    try {
      const parts = hebFmt.formatToParts(parseDate(s));
      const day = Number((parts.find(p => p.type === 'day') || {}).value);
      const month = (parts.find(p => p.type === 'month') || {}).value;
      return day && month ? gematria(day) + ' ' + month : '';
    } catch (e) { return ''; }
  }

  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(k => {
        const v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(x => append(el, x));
    else el.append(c instanceof Node ? c : String(c));
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, isError ? 5000 : 3000);
  }
  function errMsg(e) { return String((e && e.message) || e || 'שגיאה').replace(/^(Exception|Error):\s*/, ''); }

  function confirmBox(title, text, okLabel) {
    return new Promise(resolve => {
      const d = $('confirmDlg');
      $('confirmTitle').textContent = title;
      $('confirmText').textContent = text;
      $('confirmOk').textContent = okLabel || 'אישור';
      d.returnValue = '';
      d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
      d.showModal();
    });
  }

  /* ---------- Backend ---------- */
  const hasGAS = typeof google !== 'undefined' && google.script && google.script.run;
  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      if (hasGAS) {
        const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      } else {
        Promise.resolve().then(() => Mock[fn].apply(null, args)).then(resolve, reject);
      }
    });
  }

  /* ---------- State ---------- */
  let ownerKey = store.get('beitor.ownerKey');
  if (!ownerKey) {
    ownerKey = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '-' + Math.random()).replace('.', '');
    store.set('beitor.ownerKey', ownerKey);
  }
  const S = {
    data: null,
    index: {},
    weekIdx: null,
    teacher: store.get('beitor.teacher') || '',
    adminCode: store.sget('beitor.admin') || '',
    adminData: null,
    view: 'schedule',
    adminTab: 'teachers',
    adminFilter: { teacher: '', range: 'upcoming' },
    pending: null,
  };
  function pinFor(name) { return store.get('beitor.pin.' + name) || ''; }

  function setData(data) {
    S.data = data;
    S.index = {};
    data.bookings.forEach(b => { S.index[b.date + '|' + b.lesson] = b; });
    $('spaceName').textContent = data.config.spaceName;
    $('schoolName').textContent = data.config.schoolName;
    render();
  }

  function refresh() {
    return call('getState', ownerKey).then(setData).catch(e => toast(errMsg(e), true));
  }

  /* ---------- Schedule ---------- */
  function weeksOf(w) {
    const out = [];
    for (let s = w.start; s <= w.last; s = addDays(s, 7)) out.push(s);
    return out;
  }
  function weekTitle(ws) {
    const cal = S.data.calendar || {};
    const sat = addDays(ws, 6);
    const p = (cal.parashot || {})[sat];
    if (p) return p;
    const hol = (cal.holidays || {})[sat];
    if (hol && hol.length) return hol[0];
    return 'שבוע ' + fmtShort(ws);
  }
  function dayStatus(date) {
    const w = S.data.window, cfg = S.data.config;
    if (date < w.today) return 'past';
    if (cfg.closedDates && cfg.closedDates[date]) return 'closed';
    if (date > w.last) return 'locked';
    return 'open';
  }
  function isMine(b) { return b.mine || (!!S.teacher && b.teacher === S.teacher); }

  function render() {
    $('loading').hidden = true;
    $('scheduleView').hidden = S.view !== 'schedule';
    $('adminView').hidden = S.view !== 'admin';
    $('whoBtn').textContent = S.teacher ? 'שלום, ' + S.teacher : 'בחירת מורה';
    $('adminBtn').textContent = S.view === 'admin' ? 'חזרה ללוח' : 'ניהול';
    $('adminBtn').classList.toggle('on', S.view === 'admin');
    if (S.view === 'admin') return renderAdmin();

    const d = S.data, w = d.window, cfg = d.config;
    let lastDay = w.last;
    while (cfg.schoolDays.indexOf(dow(lastDay)) < 0) lastDay = addDays(lastDay, -1);
    const weeks = weeksOf(w);
    if (S.weekIdx == null || S.weekIdx >= weeks.length) S.weekIdx = 0;

    const intro = $('intro');
    intro.replaceChildren(
      h('span', null, 'בחרי שיעור פנוי כדי להשתבץ למרחב.'),
      h('span', null, 'ההרשמה פתוחה עד ', h('strong', null, 'יום ' + DAY_NAMES[dow(lastDay)] + ' ' + fmtShort(lastDay)), ' · כל יום נפתח יום נוסף.')
    );

    // My bookings
    const mine = d.bookings.filter(b => isMine(b) && b.date >= w.today)
      .sort((a, b) => (a.date + a.lesson).localeCompare(b.date + b.lesson));
    const strip = $('mineStrip');
    strip.hidden = !mine.length;
    strip.replaceChildren();
    append(strip, [
      h('h2', null, 'השיבוצים שלי:'),
      mine.map(b => h('button', {
        class: 'mine-chip', type: 'button',
        onclick: () => { S.weekIdx = weeks.findIndex(ws => b.date >= ws && b.date < addDays(ws, 7)); render(); },
      }, h('b', null, 'יום ' + DAY_NAMES[dow(b.date)] + ' ' + fmtShort(b.date)), ' · ' + lessonName(b.lesson) + ' · ' + b.className)),
    ]);

    // Tabs
    $('tabs').replaceChildren.apply($('tabs'), weeks.map((ws, i) => {
      const kicker = (w.today >= ws && w.today < addDays(ws, 7)) ? 'השבוע' : (i === 0 ? 'השבוע הקרוב' : (i === 1 ? 'שבוע הבא' : 'בעוד שבועיים'));
      const fri = addDays(ws, 5);
      return h('button', {
        class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(i === S.weekIdx),
        onclick: () => { S.weekIdx = i; render(); },
      },
        h('div', { class: 't-kicker' }, kicker),
        h('div', { class: 't-title' }, weekTitle(ws)),
        h('div', { class: 't-sub' }, fmtShort(ws) + '–' + fmtShort(fri) + ' · ' + hebDate(ws) + ' – ' + hebDate(fri)));
    }));

    $('week').replaceChildren(renderWeek(weeks[S.weekIdx]));
  }

  function lessonName(id) {
    const l = S.data.config.lessons.find(x => x.id === Number(id));
    return l ? l.name : 'שיעור ' + id;
  }

  function renderWeek(ws) {
    const d = S.data, cfg = d.config, w = d.window;
    const grid = h('div', { class: 'grid', style: '--days:' + cfg.schoolDays.length + ';--lessons:' + cfg.lessons.length });
    grid.append(h('div', { class: 'lesson-col', 'aria-hidden': 'true' },
      h('div', null),
      cfg.lessons.map(l => h('div', { class: 'lesson-label' }, h('strong', null, l.name), l.time ? h('span', null, l.time) : null))));

    cfg.schoolDays.forEach(dw => {
      const date = addDays(ws, dw);
      const st = dayStatus(date);
      const hol = ((d.calendar || {}).holidays || {})[date] || [];
      const closed = cfg.closedDates && cfg.closedDates[date];
      const chips = hol.concat(closed ? [closed] : []);
      grid.append(h('section', { class: 'day is-' + st + (date === w.today ? ' is-today' : ''), 'aria-label': 'יום ' + DAY_NAMES[dw] + ' ' + fmtShort(date) },
        h('header', { class: 'day-head' },
          h('div', { class: 'day-name' }, 'יום ' + DAY_NAMES[dw], date === w.today ? h('span', { class: 'badge' }, 'היום') : null),
          h('div', { class: 'day-date' }, h('span', null, fmtShort(date)), h('span', { class: 'heb' }, hebDate(date))),
          chips.length ? h('div', { class: 'chips' }, chips.map(t => h('span', { class: 'chip' }, t))) : null,
          st === 'locked' ? h('div', { class: 'day-note' }, 'ייפתח להרשמה ב־' + fmtShort(addDays(date, -cfg.daysAhead))) : null,
          st === 'past' ? h('div', { class: 'day-note' }, 'עבר') : null,
          st === 'closed' ? h('div', { class: 'day-note' }, 'המרחב סגור') : null),
        cfg.lessons.map(l => renderSlot(date, l, st))));
    });
    return grid;
  }

  function renderSlot(date, l, st) {
    const b = S.index[date + '|' + l.id];
    const label = h('span', { class: 'slot-label' }, l.name);
    if (b) {
      const mine = isMine(b);
      const canCancel = date >= S.data.window.today && (mine || S.adminCode);
      return h('div', { class: 'slot taken' + (mine ? ' mine' : '') },
        label,
        h('div', { class: 'who' }, h('strong', null, b.teacher), h('span', { class: 'cls' }, b.className)),
        b.topic ? h('div', { class: 'topic', title: b.topic }, b.topic) : null,
        canCancel ? h('button', { class: 'link-btn', type: 'button', onclick: () => askCancel(b) }, 'ביטול שיבוץ') : null);
    }
    if (st === 'open') {
      return h('button', {
        class: 'slot free', type: 'button', onclick: () => openBook(date, l),
        'aria-label': 'להשתבץ ל' + l.name + ' ביום ' + DAY_NAMES[dow(date)] + ' ' + fmtShort(date),
      }, label, h('span', { class: 'free-cta' }, '+ להשתבץ'));
    }
    return h('div', { class: 'slot empty' }, label, st === 'past' ? '—' : '');
  }

  /* ---------- Teacher pickers ---------- */
  function fillTeacherPicker(sel, txt, value) {
    const list = S.data.teachers || [];
    const useList = list.length > 0;
    sel.hidden = !useList; sel.required = useList;
    txt.hidden = useList; txt.required = !useList;
    if (useList) {
      sel.replaceChildren();
      append(sel, [h('option', { value: '' }, 'בחרי…'), list.map(t => h('option', { value: t.name }, t.name))]);
      sel.value = list.some(t => t.name === value) ? value : '';
    } else {
      txt.value = value || '';
    }
  }
  function pickerValue(sel, txt) { return (sel.hidden ? txt.value : sel.value).trim(); }
  function teacherHasPin(name) { return (S.data.teachers || []).some(t => t.name === name && t.hasPin); }

  /* ---------- Booking ---------- */
  function openBook(date, l) {
    S.pending = { date: date, lesson: l.id };
    const ws = addDays(date, -dow(date));
    $('bookSummary').textContent = 'יום ' + DAY_NAMES[dow(date)] + ' ' + fmtShort(date) + ' (' + hebDate(date) + ') · ' + l.name + (l.time ? ' ' + l.time : '') + ' · ' + weekTitle(ws);
    fillTeacherPicker($('bTeacherSel'), $('bTeacherTxt'), S.teacher);
    updatePinField();
    let classes = [];
    try { classes = JSON.parse(store.get('beitor.classes') || '[]'); } catch (e) { /* ignore */ }
    $('classList').replaceChildren.apply($('classList'), classes.map(c => h('option', { value: c })));
    $('bClass').value = classes[0] || '';
    $('bTopic').value = '';
    $('bookSubmit').disabled = false;
    $('bookDlg').showModal();
  }
  function updatePinField() {
    const name = pickerValue($('bTeacherSel'), $('bTeacherTxt'));
    const need = teacherHasPin(name);
    $('bPinWrap').hidden = !need;
    $('bPin').required = need;
    $('bPin').value = need ? pinFor(name) : '';
  }
  $('bTeacherSel').addEventListener('change', updatePinField);

  $('bookForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    ev.preventDefault();
    const teacher = pickerValue($('bTeacherSel'), $('bTeacherTxt'));
    const className = $('bClass').value.trim();
    const pin = $('bPin').value.trim();
    const req = { date: S.pending.date, lesson: S.pending.lesson, teacher: teacher, className: className, topic: $('bTopic').value.trim(), ownerKey: ownerKey, pin: pin };
    $('bookSubmit').disabled = true;
    call('book', req).then(data => {
      S.teacher = teacher; store.set('beitor.teacher', teacher);
      if (pin) store.set('beitor.pin.' + teacher, pin);
      let classes = [];
      try { classes = JSON.parse(store.get('beitor.classes') || '[]'); } catch (e) { /* ignore */ }
      classes = [className].concat(classes.filter(c => c !== className)).slice(0, 8);
      store.set('beitor.classes', JSON.stringify(classes));
      $('bookDlg').close();
      setData(data);
      toast('השתבצת בהצלחה! נתראה בבית אור ✨');
    }).catch(e => {
      $('bookSubmit').disabled = false;
      toast(errMsg(e), true);
      if (/תפוסה/.test(errMsg(e))) { $('bookDlg').close(); refresh(); }
    });
  });

  function askCancel(b) {
    const text = 'יום ' + DAY_NAMES[dow(b.date)] + ' ' + fmtShort(b.date) + ' · ' + lessonName(b.lesson) + ' · ' + b.teacher + ' · ' + b.className;
    confirmBox('לבטל את השיבוץ?', text, 'כן, לבטל').then(ok => {
      if (!ok) return;
      call('cancel', { id: b.id, ownerKey: ownerKey, pin: pinFor(b.teacher), adminCode: S.adminCode })
        .then(data => { setData(data); toast('השיבוץ בוטל'); if (S.adminData) loadAdmin(); })
        .catch(e => { toast(errMsg(e) + (S.adminCode ? '' : ' – אפשר לפנות לאחראית המרחב'), true); refresh(); });
    });
  }

  /* ---------- Who am I ---------- */
  $('whoBtn').addEventListener('click', () => {
    if (!S.data) return;
    fillTeacherPicker($('whoSel'), $('whoTxt'), S.teacher);
    $('whoSel').required = false; $('whoTxt').required = false;
    $('whoDlg').showModal();
  });
  $('whoForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    S.teacher = pickerValue($('whoSel'), $('whoTxt'));
    if (S.teacher) store.set('beitor.teacher', S.teacher); else store.del('beitor.teacher');
    render();
  });

  /* ---------- Admin ---------- */
  $('adminBtn').addEventListener('click', () => {
    if (S.view === 'admin') { S.view = 'schedule'; render(); return; }
    if (S.adminCode) { loadAdmin(true); return; }
    $('adminCode').value = '';
    $('adminDlg').showModal();
  });
  $('adminForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    ev.preventDefault();
    const code = $('adminCode').value.trim();
    call('adminLogin', code).then(data => {
      S.adminCode = code; store.sset('beitor.admin', code);
      $('adminDlg').close();
      S.adminData = data; S.view = 'admin'; render();
    }).catch(e => toast(errMsg(e), true));
  });

  function loadAdmin(show) {
    return call('adminLogin', S.adminCode).then(data => {
      S.adminData = data;
      if (show) S.view = 'admin';
      render();
    }).catch(e => {
      S.adminCode = ''; store.sdel('beitor.admin');
      toast(errMsg(e), true);
    });
  }
  function adminUpdate(promise, msg) {
    return promise.then(data => {
      S.adminData = data; render(); if (msg) toast(msg);
      refresh();
    }).catch(e => toast(errMsg(e), true));
  }

  function renderAdmin() {
    const A = S.adminData, root = $('adminView');
    if (!A) { root.replaceChildren(h('div', { class: 'loading' }, 'טוען…')); return; }
    const tabs = h('div', { class: 'admin-tabs', role: 'tablist' },
      [['teachers', 'מורות'], ['bookings', 'כל השיבוצים']].map(t => h('button', {
        type: 'button', role: 'tab', 'aria-selected': String(S.adminTab === t[0]),
        onclick: () => { S.adminTab = t[0]; render(); },
      }, t[1])),
      h('button', { type: 'button', onclick: () => { S.adminCode = ''; S.adminData = null; store.sdel('beitor.admin'); S.view = 'schedule'; render(); } }, 'יציאה מהניהול'));
    root.replaceChildren(tabs, S.adminTab === 'teachers' ? renderTeachersAdmin(A) : renderBookingsAdmin(A));
  }

  function renderTeachersAdmin(A) {
    const upcoming = {}, total = {};
    A.bookings.forEach(b => {
      total[b.teacher] = (total[b.teacher] || 0) + 1;
      if (b.date >= A.today) upcoming[b.teacher] = (upcoming[b.teacher] || 0) + 1;
    });
    const active = A.teachers.filter(t => t.active).length;
    const upcomingCount = A.bookings.filter(b => b.date >= A.today).length;

    const bulk = h('textarea', { rows: 6, placeholder: 'רחל כהן\nמרים לוי\n…' });
    const panel = h('div', { class: 'panel' },
      h('div', { class: 'row', style: 'justify-content:space-between;align-items:center;margin-bottom:12px' },
        h('div', null, h('h2', null, 'רשימת המורות'),
          h('p', { class: 'muted', style: 'margin:0' }, 'המורות ברשימה יופיעו לבחירה בעת ההשתבצות. מורה לא פעילה נשמרת אך לא מופיעה.')),
        h('button', { class: 'btn primary', type: 'button', onclick: () => editTeacher(null) }, '+ הוספת מורה')),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', null, active), h('span', null, 'מורות פעילות')),
        h('div', { class: 'stat' }, h('b', null, upcomingCount), h('span', null, 'שיבוצים עתידיים')),
        h('div', { class: 'stat' }, h('b', null, A.bookings.length), h('span', null, 'שיבוצים ב־60 הימים האחרונים ואילך'))),
      A.teachers.length ? h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, h('th', null, 'שם'), h('th', null, 'קוד אישי'), h('th', null, 'סטטוס'),
          h('th', null, 'שיבוצים קרובים'), h('th', null, 'סה״כ (60 יום)'), h('th', null, ''))),
        h('tbody', null, A.teachers.map(t => h('tr', { class: t.active ? '' : 'inactive' },
          h('td', null, h('strong', null, t.name)),
          h('td', null, t.pin ? t.pin : h('span', { class: 'hint' }, '—')),
          h('td', null, t.active ? 'פעילה' : 'לא פעילה'),
          h('td', { class: 'num' }, upcoming[t.name] || 0),
          h('td', { class: 'num' }, total[t.name] || 0),
          h('td', null, h('div', { class: 'actions' },
            h('button', { class: 'link', type: 'button', onclick: () => { S.adminTab = 'bookings'; S.adminFilter.teacher = t.name; render(); } }, 'שיבוצים'),
            h('button', { class: 'link', type: 'button', onclick: () => editTeacher(t) }, 'עריכה'),
            h('button', { class: 'link danger', type: 'button', onclick: () => deleteTeacher(t) }, 'מחיקה'))))))))
        : h('p', { class: 'empty-msg' }, 'עדיין אין מורות ברשימה. אפשר להוסיף אחת־אחת או להדביק רשימה למטה. כל עוד הרשימה ריקה, המורות מקלידות את שמן בחופשיות.'),
      h('details', { open: A.teachers.length ? null : true },
        h('summary', null, 'הדבקת רשימת מורות'),
        h('div', { style: 'display:flex;flex-direction:column;gap:10px;margin-top:10px;max-width:420px' },
          h('label', null, 'שם בכל שורה', bulk),
          h('div', null, h('button', {
            class: 'btn primary', type: 'button',
            onclick: () => {
              const names = bulk.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
              if (!names.length) return toast('אין שמות להוספה', true);
              adminUpdate(call('adminAddTeachers', S.adminCode, names), 'הרשימה נוספה');
            },
          }, 'הוספת כל השמות')))));
    return panel;
  }

  let editingTeacher = null;
  function editTeacher(t) {
    editingTeacher = t;
    $('teacherDlgTitle').textContent = t ? 'עריכת מורה' : 'מורה חדשה';
    $('tName').value = t ? t.name : '';
    $('tPin').value = t ? t.pin : '';
    $('tActive').checked = t ? t.active : true;
    $('teacherDlg').showModal();
  }
  $('teacherForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    ev.preventDefault();
    const t = { name: $('tName').value.trim(), pin: $('tPin').value.trim(), active: $('tActive').checked };
    call('adminSaveTeacher', S.adminCode, t, editingTeacher ? editingTeacher.name : '')
      .then(data => { $('teacherDlg').close(); S.adminData = data; render(); toast('נשמר'); refresh(); })
      .catch(e => toast(errMsg(e), true));
  });
  function deleteTeacher(t) {
    confirmBox('למחוק את ' + t.name + '?', 'השיבוצים הקיימים שלה יישארו בלוח. אם היא רק לא מלמדת כרגע, אפשר לסמן אותה כ"לא פעילה" במקום למחוק.', 'מחיקה')
      .then(ok => { if (ok) adminUpdate(call('adminDeleteTeacher', S.adminCode, t.name), 'נמחקה'); });
  }

  function renderBookingsAdmin(A) {
    const F = S.adminFilter;
    const names = Array.from(new Set(A.teachers.map(t => t.name).concat(A.bookings.map(b => b.teacher)))).sort((a, b) => a.localeCompare(b, 'he'));
    const rows = A.bookings.filter(b => (!F.teacher || b.teacher === F.teacher) && (F.range === 'all' || b.date >= A.today));
    const teacherSel = h('select', { onchange: (e) => { F.teacher = e.target.value; render(); } },
      h('option', { value: '' }, 'כל המורות'), names.map(n => h('option', { value: n }, n)));
    teacherSel.value = F.teacher;
    const rangeSel = h('select', { onchange: (e) => { F.range = e.target.value; render(); } },
      h('option', { value: 'upcoming' }, 'מהיום והלאה'), h('option', { value: 'all' }, 'כולל 60 הימים האחרונים'));
    rangeSel.value = F.range;

    return h('div', { class: 'panel' },
      h('h2', null, 'כל השיבוצים'),
      h('p', { class: 'muted' }, 'רשימת השיבוצים במרחב. כמנהלת אפשר לבטל כל שיבוץ (גם מתוך הלוח עצמו).'),
      h('div', { class: 'row', style: 'margin-bottom:12px' },
        h('label', null, 'מורה', teacherSel), h('label', null, 'טווח', rangeSel)),
      rows.length ? h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['תאריך', 'שיעור', 'מורה', 'כיתה', 'נושא', ''].map(x => h('th', null, x)))),
        h('tbody', null, rows.map(b => h('tr', null,
          h('td', { style: 'white-space:nowrap' }, 'יום ' + DAY_NAMES[dow(b.date)] + ' ' + fmtShort(b.date), h('div', { class: 'hint' }, hebDate(b.date))),
          h('td', null, S.data ? lessonName(b.lesson) : b.lesson),
          h('td', null, b.teacher),
          h('td', null, b.className),
          h('td', null, b.topic || h('span', { class: 'hint' }, '—')),
          h('td', null, b.date >= A.today ? h('div', { class: 'actions' }, h('button', {
            class: 'link danger', type: 'button',
            onclick: () => confirmBox('לבטל את השיבוץ?', b.teacher + ' · ' + fmtShort(b.date) + ' · ' + lessonName(b.lesson), 'כן, לבטל')
              .then(ok => { if (ok) adminUpdate(call('adminCancel', S.adminCode, b.id), 'השיבוץ בוטל'); }),
          }, 'ביטול')) : null))))))
        : h('p', { class: 'empty-msg' }, 'אין שיבוצים להצגה.'));
  }

  /* ---------- Preview backend (used only outside Google Apps Script) ---------- */
  const Mock = (function () {
    const K = 'beitor.mock.v1';
    const LESSONS = [1, 2, 3, 4, 5].map(i => ({ id: i, name: 'שיעור ' + i, time: '' }));
    function today() {
      const p = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      return p;
    }
    function win() {
      const t = today(), last = addDays(t, 10);
      const start = dow(t) === 6 ? addDays(t, 1) : addDays(t, -dow(t));
      return { today: t, last: last, start: start, end: addDays(last, 6 - dow(last)) };
    }
    function load() {
      let db = null;
      try { db = JSON.parse(store.get(K) || 'null'); } catch (e) { /* ignore */ }
      if (!db) {
        const w = win();
        const names = ['רחל כהן', 'מרים לוי', 'שרה פרידמן', 'חנה וייס', 'אסתר גולדברג', 'לאה שפירא'];
        db = { teachers: names.map((n, i) => ({ name: n, pin: i === 1 ? '1111' : '', active: true })), bookings: [] };
        const sample = [[1, 2, 0, 'ו׳1', 'סדנת אור וחושך'], [2, 4, 1, 'ד׳2', ''], [3, 1, 3, 'ח׳', 'משחק בריחה – יציאת מצרים']];
        sample.forEach((s, i) => {
          let d = addDays(w.today, s[0]); if (dow(d) === 6) d = addDays(d, 1);
          db.bookings.push({ id: 'm' + i, date: d, lesson: s[1], teacher: names[s[2]], className: s[3], topic: s[4], ownerKey: 'other' });
        });
        save(db);
      }
      return db;
    }
    function save(db) { store.set(K, JSON.stringify(db)); }
    let calPromise = null;
    function calendar(w) {
      if (!calPromise) {
        const url = 'https://www.hebcal.com/hebcal?v=1&cfg=json&i=on&lg=he&s=on&maj=on&min=on&mod=on&nx=on&ss=off&mf=off&c=off&start=' + w.start + '&end=' + addDays(w.end, 1);
        calPromise = fetch(url).then(r => r.json()).then(j => {
          const out = { parashot: {}, holidays: {} };
          (j.items || []).forEach(it => {
            const d = String(it.date).slice(0, 10), title = it.hebrew || it.title;
            if (it.category === 'parashat') out.parashot[d] = title;
            else (out.holidays[d] = out.holidays[d] || []).push(title);
          });
          return out;
        }).catch(() => ({ parashot: {}, holidays: {} }));
      }
      return calPromise;
    }
    function pub(b, key) { return { id: b.id, date: b.date, lesson: b.lesson, teacher: b.teacher, className: b.className, topic: b.topic, mine: !!key && b.ownerKey === key }; }
    function isAdmin(c) { return c === '1234'; }
    function adminData() {
      const db = load(), w = win(), from = addDays(w.today, -60);
      return { today: w.today, teachers: db.teachers, bookings: db.bookings.filter(b => b.date >= from).map(b => pub(b)).sort((a, b) => (a.date + a.lesson).localeCompare(b.date + b.lesson)) };
    }
    const api = {
      getState(key) {
        const db = load(), w = win();
        return calendar(w).then(cal => ({
          window: w,
          config: { schoolName: 'בנות מנחם', spaceName: 'בית אור', daysAhead: 10, schoolDays: [0, 1, 2, 3, 4, 5], lessons: LESSONS, closedDates: {} },
          teachers: db.teachers.filter(t => t.active).map(t => ({ name: t.name, hasPin: !!t.pin })),
          bookings: db.bookings.filter(b => b.date >= w.start && b.date <= w.end).map(b => pub(b, key)),
          calendar: cal,
        }));
      },
      book(r) {
        const db = load(), w = win();
        if (!r.teacher) throw new Error('יש לבחור שם מורה');
        if (!r.className) throw new Error('יש למלא כיתה');
        if (r.date < w.today || r.date > w.last || dow(r.date) === 6) throw new Error('לא ניתן להשתבץ בתאריך זה');
        const t = db.teachers.find(x => x.name === r.teacher);
        if (db.teachers.length && !t) throw new Error('המורה לא נמצאת ברשימה');
        if (t && t.pin && t.pin !== r.pin) throw new Error('הקוד האישי שגוי');
        const taken = db.bookings.find(b => b.date === r.date && b.lesson === r.lesson);
        if (taken) throw new Error('השעה הזו כבר תפוסה – ' + taken.teacher + ' השתבצה אליה');
        db.bookings.push({ id: 'm' + Date.now(), date: r.date, lesson: r.lesson, teacher: r.teacher, className: r.className, topic: r.topic, ownerKey: r.ownerKey });
        save(db);
        return api.getState(r.ownerKey);
      },
      cancel(r) {
        const db = load();
        const b = db.bookings.find(x => x.id === r.id);
        if (!b) throw new Error('השיבוץ לא נמצא (אולי כבר בוטל)');
        const t = db.teachers.find(x => x.name === b.teacher);
        if (!(r.ownerKey === b.ownerKey || (t && t.pin && t.pin === r.pin) || isAdmin(r.adminCode))) throw new Error('אין הרשאה לבטל שיבוץ זה');
        db.bookings = db.bookings.filter(x => x !== b);
        save(db);
        return api.getState(r.ownerKey);
      },
      adminLogin(c) { if (!isAdmin(c)) throw new Error('קוד ניהול שגוי'); return adminData(); },
      adminSaveTeacher(c, t, orig) {
        if (!isAdmin(c)) throw new Error('קוד ניהול שגוי');
        if (!t.name) throw new Error('יש למלא שם');
        const db = load();
        const idx = orig ? db.teachers.findIndex(x => x.name === orig) : -1;
        if (db.teachers.some((x, i) => x.name === t.name && i !== idx)) throw new Error('כבר קיימת מורה בשם הזה');
        if (idx >= 0) {
          db.teachers[idx] = t;
          if (orig !== t.name) db.bookings.forEach(b => { if (b.teacher === orig) b.teacher = t.name; });
        } else db.teachers.push(t);
        save(db); return adminData();
      },
      adminAddTeachers(c, names) {
        if (!isAdmin(c)) throw new Error('קוד ניהול שגוי');
        const db = load();
        names.forEach(n => { if (!db.teachers.some(t => t.name === n)) db.teachers.push({ name: n, pin: '', active: true }); });
        save(db); return adminData();
      },
      adminDeleteTeacher(c, name) {
        if (!isAdmin(c)) throw new Error('קוד ניהול שגוי');
        const db = load(); db.teachers = db.teachers.filter(t => t.name !== name); save(db); return adminData();
      },
      adminCancel(c, id) {
        if (!isAdmin(c)) throw new Error('קוד ניהול שגוי');
        const db = load(); db.bookings = db.bookings.filter(b => b.id !== id); save(db); return adminData();
      },
    };
    return api;
  })();

  /* ---------- Start ---------- */
  if (!hasGAS) $('previewBanner').hidden = false;
  refresh().then(() => { if (S.adminCode && S.data) loadAdmin(false); });
  setInterval(() => {
    if (document.visibilityState === 'visible' && S.view === 'schedule' && !document.querySelector('dialog[open]')) refresh();
  }, 60000);
})();
</script>
