<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בית אור · שיבוץ שיעורים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='24' fill='%238a3f45'/%3E%3Cpath d='M24 9c4 6 9 9.5 9 16.5a9 9 0 0 1-18 0c0-4 2-6.5 3.5-8 .3 3 1.8 4.6 3.4 5.2C21 18 22 13 24 9z' fill='%23e2cba4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Sampled from the space: dusty-rose acoustic walls, wine band, terracotta beams,
       plywood, and the cushions: petrol, powder blue, mist, slate, sage, olive, cream */
    --bg: #f6f1eb;
    --surface: #fffdfa;
    --surface-2: #f1e9e1;
    --ink: #3a2b2b;
    --ink-2: #6c5a57;
    --ink-3: #a09089;
    --line: #e8dbd1;
    --blush: #dfb3a3;
    --blush-soft: #f4e3db;
    --berry: #8a3f45;
    --berry-strong: #73333a;
    --terra: #c06a3e;
    --terra-soft: #f6e2d4;
    --teal: #2f5f62;
    --teal-strong: #244b4e;
    --teal-soft: #dbe6e5;
    --sage-soft: #e6ebe2;
    --wood: #dcc29b;
    --wood-soft: #f4e9d8;
    --wood-line: #c4a274;
    --danger: #a3323a;
    --c-petrol: #3d6e70;
    --c-powder: #8fb0cf;
    --c-mist: #a9c4c2;
    --c-slate: #8a9aa1;
    --c-sage: #94a98f;
    --c-olive: #a9a173;
    --c-cream: #cbbf9c;
    --c-rose: #c9978a;
    --pattern: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='rgba%28150%2C60%2C60%2C.10%29' stroke-width='1'><path d='M60 0V120M0 60H120M0 0.5H120M0.5 0V120'/></g><g fill='none' stroke='rgba%28150%2C60%2C60%2C.16%29' stroke-width='1.4' stroke-linecap='round'><path d='M0 46 A14 14 0 0 1 14 60'/><path d='M0 34 A26 26 0 0 1 26 60'/><path d='M0 22 A38 38 0 0 1 38 60'/><path d='M0 10 A50 50 0 0 1 50 60'/><path d='M66 6L114 54M114 6L66 54'/><rect x='10' y='80' width='40' height='20' rx='10'/><rect x='18' y='86' width='24' height='8' rx='4'/><circle cx='90' cy='90' r='20'/><circle cx='90' cy='90' r='9'/></g></svg>");
    --pattern-band: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='rgba%28255%2C255%2C255%2C.06%29' stroke-width='1'><path d='M60 0V120M0 60H120M0 0.5H120M0.5 0V120'/></g><g fill='none' stroke='rgba%28255%2C255%2C255%2C.10%29' stroke-width='1.4' stroke-linecap='round'><path d='M0 46 A14 14 0 0 1 14 60'/><path d='M0 34 A26 26 0 0 1 26 60'/><path d='M0 22 A38 38 0 0 1 38 60'/><path d='M0 10 A50 50 0 0 1 50 60'/><path d='M66 6L114 54M114 6L66 54'/><rect x='10' y='80' width='40' height='20' rx='10'/><rect x='18' y='86' width='24' height='8' rx='4'/><circle cx='90' cy='90' r='20'/><circle cx='90' cy='90' r='9'/></g></svg>");
    --shadow: 0 1px 2px rgba(80,40,30,.06), 0 6px 18px rgba(80,40,30,.07);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1617;
      --surface: #261e20;
      --surface-2: #31272a;
      --ink: #f6ece8;
      --ink-2: #ccbab4;
      --ink-3: #8f7d78;
      --line: #3d3133;
      --blush: #5a3a36;
      --blush-soft: #3a2a2a;
      --berry: #d99099;
      --berry-strong: #e8a9b0;
      --terra: #ec9a68;
      --terra-soft: #3d2b22;
      --teal: #8cbcbc;
      --teal-strong: #a8d2d1;
      --teal-soft: #213433;
      --sage-soft: #26302a;
      --wood: #d8bb88;
      --wood-soft: #3a3125;
      --wood-line: #8d7246;
      --danger: #ff8f8f;
      --pattern: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='rgba%28255%2C200%2C190%2C.05%29' stroke-width='1'><path d='M60 0V120M0 60H120M0 0.5H120M0.5 0V120'/></g><g fill='none' stroke='rgba%28255%2C200%2C190%2C.08%29' stroke-width='1.4' stroke-linecap='round'><path d='M0 46 A14 14 0 0 1 14 60'/><path d='M0 34 A26 26 0 0 1 26 60'/><path d='M0 22 A38 38 0 0 1 38 60'/><path d='M0 10 A50 50 0 0 1 50 60'/><path d='M66 6L114 54M114 6L66 54'/><rect x='10' y='80' width='40' height='20' rx='10'/><rect x='18' y='86' width='24' height='8' rx='4'/><circle cx='90' cy='90' r='20'/><circle cx='90' cy='90' r='9'/></g></svg>");
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 "Heebo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .t-title, .page-title, .section-title, .fb-week { font-family: "Rubik", "Heebo", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  [hidden] { display: none !important; }
  .icons { display: inline-flex; gap: 6px; align-items: center; }
  .icons svg { width: 26px; height: 26px; }

  /* Header: blush acoustic-panel wall with a berry band, like the space */
  .top { background: #dfb3a3 var(--pattern); color: #4f2c2c; position: relative; }
  @media (prefers-color-scheme: dark) { .top { background-color: var(--blush); } }
  .top::after { content: ""; display: block; height: 14px; background: #8a3f45 var(--pattern-band); background-size: 120px 120px; }
  @media (prefers-color-scheme: dark) { .top { color: var(--ink); } .top::after { background-color: #5e2c31; } }
  .top .wrap { display: flex; align-items: center; gap: 10px 14px; padding-top: 16px; padding-bottom: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; }
  .logo { width: 50px; height: 50px; flex: none; }
  .brand h1 { margin: 0; font-size: 27px; font-weight: 700; line-height: 1.1; color: #73333a; }
  @media (prefers-color-scheme: dark) { .brand h1 { color: var(--berry-strong); } }
  .brand p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav a, .pill {
    border: 0; background: rgba(255,253,249,.75); color: #73333a; text-decoration: none;
    border-radius: 999px; padding: 7px 15px; font-weight: 600; font-size: 14px; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(140,51,64,.15);
  }
  .nav a:hover, .pill:hover { background: #fffdf9; }
  .nav a[aria-current="page"] { background: #8a3f45; color: #fff; }
  @media (prefers-color-scheme: dark) {
    .nav a, .pill { background: rgba(38,30,32,.7); color: var(--ink); }
    .nav a[aria-current="page"] { background: #8a3f45; color: #fff; }
  }
  .me { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .me .pill { padding: 5px 12px; font-size: 13px; }

  main.wrap { padding-top: 24px; padding-bottom: 60px; }
  .intro { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; margin-bottom: 14px; color: var(--ink-2); }
  .intro strong { color: var(--ink); }
  .page-title { margin: 0 0 4px; font-size: 28px; font-weight: 700; color: var(--berry-strong); }

  /* Login: the wall – panels above, berry band below */
  .login {
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background:
      linear-gradient(to bottom, transparent 64%, #8a3f45 64%, #8a3f45 86%, var(--blush) 86%),
      var(--pattern), var(--blush);
  }
  @media (prefers-color-scheme: dark) {
    .login { background: linear-gradient(to bottom, transparent 64%, #5e2c31 64%, #5e2c31 86%, transparent 86%), var(--pattern), var(--bg); }
  }
  .login-card {
    width: min(410px, 100%); background: var(--surface); border-radius: 30px; padding: 30px 26px 24px;
    box-shadow: 0 30px 70px rgba(90,30,30,.25); text-align: center; border-bottom: 6px solid var(--wood);
  }
  .login-card .icons { margin-bottom: 10px; }
  .login-card .icons svg { width: 44px; height: 44px; }
  .login-card h1 { margin: 0; font-size: 34px; font-weight: 700; color: var(--berry-strong); }
  .login-card .sub { color: var(--ink-2); margin: 4px 0 22px; }
  .login-card form { display: flex; flex-direction: column; gap: 12px; text-align: start; }
  .login-card input { font-size: 20px; text-align: center; letter-spacing: 1px; direction: ltr; padding: 12px; border-radius: 14px; }
  .login-card .btn { padding: 13px; font-size: 16px; border-radius: 14px; }
  .login-err { color: var(--danger); font-size: 14px; min-height: 1.4em; text-align: center; }
  .login-foot { margin-top: 18px; font-size: 13px; }
  .linkish { border: 0; background: none; color: var(--ink-3); text-decoration: underline; padding: 0; font-size: 13px; }

  /* My bookings */
  .mine-strip {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 18px; box-shadow: var(--shadow);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .mine-strip h2 { font-size: 14px; margin: 0; color: var(--ink-2); font-weight: 600; font-family: "Heebo", sans-serif; }
  .mine-chip { border: 1px solid var(--wood-line); background: var(--wood-soft); border-radius: 999px; padding: 5px 12px; font-size: 13px; text-align: start; }
  .mine-chip b { font-weight: 600; }

  /* Week tabs */
  .tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
  .tab {
    flex: 1 0 200px; text-align: start; border: 1px solid var(--line); background: var(--surface);
    border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .tab .t-kicker { font-size: 12px; color: var(--ink-3); font-weight: 600; letter-spacing: .3px; }
  .tab .t-title { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 2px 0; }
  .tab .t-sub { font-size: 13px; color: var(--ink-2); }
  .tab .t-quota { font-size: 12px; margin-top: 4px; color: var(--teal); font-weight: 600; }
  .tab .t-quota.full { color: var(--danger); }
  .tab[aria-selected="true"] { background: var(--blush-soft); border-color: var(--blush); }
  .tab[aria-selected="true"] .t-title { color: var(--berry-strong); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 6px; background: var(--berry); }

  /* Week grid */
  .grid {
    display: grid;
    grid-template-columns: 96px repeat(var(--days), minmax(0, 1fr));
    grid-template-rows: auto repeat(var(--lessons), minmax(84px, auto));
    gap: 8px;
  }
  .lesson-col, .day { display: grid; grid-row: 1 / -1; grid-template-rows: subgrid; gap: 8px; }
  .lesson-label {
    display: flex; flex-direction: column; justify-content: center; padding: 0 10px;
    color: var(--ink-2); border-inline-end: 4px solid var(--terra); border-radius: 2px;
  }
  .lesson-label strong { color: var(--ink); font-weight: 700; }
  .lesson-label span { font-size: 12px; direction: ltr; text-align: right; white-space: nowrap; }
  .day-head {
    background: var(--surface); border: 1px solid var(--line); border-bottom: 5px solid var(--wood);
    border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow);
  }
  .day-name { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .day-date { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; }
  .heb { color: var(--berry); font-weight: 600; }
  .greg { font-size: .78em; color: var(--ink-3); font-weight: 400; margin-inline-start: 5px; }
  .badge { background: var(--terra); color: #fff; font-size: 11px; border-radius: 999px; padding: 1px 9px; font-weight: 700; }
  @media (prefers-color-scheme: dark) { .badge { color: #2a160c; } }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; background: var(--teal-soft); color: var(--teal); border-radius: 999px; padding: 1px 8px; }
  .chip.closed { background: var(--blush-soft); color: var(--berry-strong); font-weight: 700; }
  .day-note { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .is-today .day-head { border-color: var(--terra); border-bottom-color: var(--terra); box-shadow: 0 0 0 3px var(--terra-soft), var(--shadow); }

  .slot {
    border-radius: 16px; padding: 9px 12px; min-width: 0; text-align: start; display: flex; flex-direction: column; gap: 2px;
    border: 1px solid var(--line); background: var(--surface); position: relative;
  }
  .slot-label { display: none; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .slot.free {
    border: 1.5px dashed #d9c6ba; background: transparent; justify-content: center; align-items: center;
    color: var(--ink-3); transition: background .15s, border-color .15s, color .15s;
  }
  @media (prefers-color-scheme: dark) { .slot.free { border-color: var(--line); } }
  .slot.free:hover, .slot.free:focus-visible { border-color: var(--berry); border-style: solid; color: var(--berry-strong); background: var(--blush-soft); outline: none; }
  .free-cta { font-weight: 700; font-size: 14px; }
  .slot.taken { --c: var(--c-sage); background: color-mix(in srgb, var(--c) 34%, var(--surface)); border-color: transparent; border-inline-start: 6px solid var(--c); }
  @media (prefers-color-scheme: dark) { .slot.taken { background: color-mix(in srgb, var(--c) 22%, var(--surface)); } }
  .slot.taken .who { display: flex; flex-direction: column; min-width: 0; }
  .slot.taken strong { font-weight: 700; color: color-mix(in srgb, var(--c) 45%, #1b1716); overflow-wrap: anywhere; }
  @media (prefers-color-scheme: dark) { .slot.taken strong { color: color-mix(in srgb, var(--c) 55%, #fff); } }
  .slot .cls { font-size: 13px; color: var(--ink-2); }
  .slot .topic { font-size: 12px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .slot.taken.mine, .slot.mine { background: var(--wood-soft); border: 1.5px solid var(--wood-line); }
  .slot.mine strong { color: var(--ink); }
  .slot.mine::before {
    content: "שלי"; position: absolute; top: 7px; inset-inline-end: 9px; font-size: 10px; font-weight: 700;
    color: #fff; background: var(--terra); border-radius: 999px; padding: 0 7px; line-height: 16px;
  }
  .slot.full { border: 1.5px dashed var(--line); background: transparent; justify-content: center; align-items: center; color: var(--ink-3); font-size: 13px; }
  .slot.none { background: transparent; border: 0; }
  .slot.blocked { background: var(--surface-2) var(--pattern); border: 1px solid var(--line); color: var(--ink-3); justify-content: center; align-items: center; font-size: 13px; text-align: center; }
  .slot.blocked b { color: var(--ink-2); font-weight: 600; }
  .lesson-picks { display: flex; gap: 6px; flex-wrap: wrap; }
  .lesson-picks label { flex-direction: row; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 999px; padding: 6px 12px; color: var(--ink); cursor: pointer; }
  .lesson-picks input { width: auto; accent-color: var(--teal); }
  .lesson-picks label.off { opacity: .4; pointer-events: none; }
  .slot.empty { background: transparent; border-color: transparent; color: var(--ink-3); justify-content: center; align-items: center; }
  .is-locked .slot.empty, .is-closed .slot.empty { background: var(--surface-2) var(--pattern); border-color: var(--line); opacity: .7; }
  .is-past .slot.taken { opacity: .78; }
  .is-past .day-head, .is-closed .day-head { opacity: .8; }
  .slot-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .link-btn { border: 0; background: none; padding: 0; color: var(--danger); font-size: 12px; font-weight: 700; text-decoration: none; }
  .link-btn.fb { color: var(--teal); }
  .link-btn:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .grid { display: flex; flex-direction: column; gap: 14px; }
    .lesson-col { display: none; }
    .day { display: flex; flex-direction: column; gap: 6px; }
    .slot { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 52px; }
    .slot-label { display: block; flex: 0 0 64px; }
    .slot.free, .slot.full { justify-content: flex-start; }
    .slot.taken .who { flex-direction: row; gap: 8px; align-items: baseline; flex: 1; }
    .slot .topic { flex-basis: 100%; padding-inline-start: 74px; }
    .slot.empty { justify-content: flex-start; min-height: 40px; }
    .slot-actions { margin-inline-start: auto; }
    .day.is-past, .slot.none { display: none; }
    .tab { flex-basis: 170px; }
    .brand h1 { font-size: 24px; }
  }

  /* Panels, tables, admin */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px; }
  .panel h2 { margin: 0 0 4px; font-size: 21px; font-weight: 700; color: var(--berry-strong); }
  .panel .muted { color: var(--ink-2); margin: 0 0 14px; font-size: 14px; }
  .admin-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .admin-tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; font-weight: 600; }
  .admin-tabs button[aria-selected="true"] { background: var(--berry); color: #fff; border-color: var(--berry); }
  @media (prefers-color-scheme: dark) { .admin-tabs button[aria-selected="true"] { color: #2a1215; } }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > label { flex: 1 1 160px; }
  .head-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: start; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  tr.inactive td { color: var(--ink-3); }
  td.num { font-variant-numeric: tabular-nums; }
  td.ltr { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .actions { display: flex; gap: 12px; justify-content: flex-end; white-space: nowrap; }
  .link { border: 0; background: none; padding: 0; color: var(--teal); font-weight: 700; font-size: 13px; }
  .link.danger { color: var(--danger); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--blush-soft); border-radius: 16px; padding: 12px 14px; }
  .stat:nth-child(2) { background: color-mix(in srgb, var(--c-mist) 30%, var(--surface)); }
  .stat:nth-child(3) { background: var(--wood-soft); }
  .stat b { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; font-family: "Rubik", sans-serif; }
  .stat span { font-size: 13px; color: var(--ink-2); }
  details summary { cursor: pointer; color: var(--teal); font-weight: 700; margin-top: 14px; }
  .intro-row { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
  .intro-row .intro { margin-bottom: 0; flex: 1; }
  .print-title { display: none; }
  .notices { background: var(--wood-soft); border: 1.5px solid var(--wood-line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .notices .n-row { display: flex; gap: 8px; align-items: baseline; }
  .notices .btn { align-self: flex-start; margin-top: 4px; }
  .wait { font-size: 12px; color: var(--ink-2); }
  .wait b { color: var(--terra); }
  .link-btn.wait-btn { color: var(--ink-2); }
  .fixed-tag { font-size: 10px; font-weight: 700; color: var(--teal-strong); background: var(--teal-soft); border-radius: 999px; padding: 0 7px; line-height: 16px; align-self: flex-start; }
  .series-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; align-items: end; }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    :root { --bg: #fff; --surface: #fff; --shadow: none; }
    body { background: #fff; font-size: 11px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

<script>
(function () {
  'use strict';

  /* ---------- Utilities ---------- */
  const $ = (id) => document.getElementById(id);
  const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
    sget(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    sset(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    sdel(k) { try { sessionStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  function parseDate(s) { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function addDays(s, n) { const d = parseDate(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function dow(s) { return parseDate(s).getUTCDay(); }
  function fmtShort(s) { const d = parseDate(s); return d.getUTCDate() + '.' + (d.getUTCMonth() + 1); }
  function fmtLong(s) { const hd = hebDate(s); return 'יום ' + DAY_NAMES[dow(s)] + ' ' + (hd ? hd + ' (' + fmtShort(s) + ')' : fmtShort(s)); }
  function fmtPhone(p) { return p && p.length === 10 ? p.slice(0, 3) + '-' + p.slice(3) : (p || ''); }

  function gematria(n) {
    if (n === 15) return 'ט״ו';
    if (n === 16) return 'ט״ז';
    const tens = ['', 'י', 'כ', 'ל'][Math.floor(n / 10)] || '';
    const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'][n % 10];
    const s = tens + ones;
    return s.length === 1 ? s + '׳' : s.slice(0, -1) + '״' + s.slice(-1);
  }
  let hebFmt = null;
  try { hebFmt = new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long', timeZone: 'UTC' }); } catch (e) { /* unsupported */ }
  function hebDate(s) {
    if (!hebFmt) return '';
    try {
      const parts = hebFmt.formatToParts(parseDate(s));
      const day = Number((parts.find(p => p.type === 'day') || {}).value);
      const month = (parts.find(p => p.type === 'month') || {}).value;
      return day && month ? gematria(day) + ' ' + month : '';
    } catch (e) { return ''; }
  }

  const CUSHIONS = ['petrol', 'powder', 'sage', 'cream', 'slate', 'olive', 'mist', 'rose'];
  /** Each teacher gets a stable cushion color, like the stack of cubes in the space. */
  function teacherColor(name) {
    let x = 0;
    for (let i = 0; i < name.length; i++) x = (x * 31 + name.charCodeAt(i)) >>> 0;
    return '--c: var(--c-' + CUSHIONS[x % CUSHIONS.length] + ')';
  }

  function fmtShortHeb(s) { return hebDate(s) || fmtShort(s); }

  /** Hebrew date first, Gregorian smaller: "יום שלישי כ״ה תשרי 6.10". */
  function dateEl(s, noDay) {
    const hd = hebDate(s);
    return h('span', { class: 'date' }, (noDay ? '' : 'יום ' + DAY_NAMES[dow(s)] + ' ') + (hd || ''), h('small', { class: 'greg' }, fmtShort(s)));
  }

  function h(tag, props) {
    const el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(k => {
        const v = props[k];
        if (v == null || v === false) return;
        if (k === 'class') el.className = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (let i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) c.forEach(x => append(el, x));
    else el.append(c instanceof Node ? c : String(c));
  }
  function fill(el) {
    el.replaceChildren();
    for (let i = 1; i < arguments.length; i++) append(el, arguments[i]);
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast' + (isError ? ' error' : ''); }, isError ? 5000 : 3000);
  }
  function errMsg(e) { return String((e && e.message) || e || 'שגיאה'); }

  function confirmBox(title, text, okLabel) {
    return new Promise(resolve => {
      const d = $('confirmDlg');
      $('confirmTitle').textContent = title;
      $('confirmText').textContent = text;
      $('confirmOk').textContent = okLabel || 'אישור';
      d.returnValue = '';
      d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
      d.showModal();
    });
  }

  /* ---------- State & API ---------- */
  const S = {
    token: store.get('beitor.token') || '',
    guest: store.get('beitor.guest') === '1',
    me: null,
    adminCode: store.sget('beitor.admin') || '',
    data: null,
    index: {},
    weekIdx: null,
    fb: null,
    fbFilter: { teacher: '', q: '', tag: '' },
    adminData: null,
    adminTab: 'teachers',
    settingsOpen: null,
    adminFilter: { teacher: '', range: 'upcoming' },
    fbAdmin: { teacher: '', selected: {} },
    suggestions: null,
  };

  function call(fn) {
    const args = Array.prototype.slice.call(arguments, 1);
    return fetch('api/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ auth: { token: S.token, adminCode: S.adminCode, guest: S.guest }, args: args }),
    }).then(
      r => r.json().catch(() => ({ ok: false, error: 'שגיאת תקשורת' })),
      () => ({ ok: false, error: 'אין חיבור לשרת, נסי שוב' })
    ).then(j => {
      if (j.ok) return j.result;
      if (j.auth) handleAuthLost();
      throw new Error(j.error || 'שגיאה');
    });
  }

  function handleAuthLost() {
    S.token = ''; store.del('beitor.token');
    S.guest = false; store.del('beitor.guest');
    S.adminCode = ''; store.sdel('beitor.admin');
    S.data = null; S.fb = null; S.adminData = null;
    showLogin();
  }

  function loggedIn() { return !!(S.token || S.adminCode || S.guest); }
  function isGuest() { return !!(S.data && S.data.guest); }

  /* ---------- Login ---------- */
  function showLogin() {
    $('app').hidden = true;
    $('loginView').hidden = false;
    $('loginErr').textContent = '';
    setTimeout(() => $('loginPhone').focus(), 50);
  }

  $('loginForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const phone = $('loginPhone').value.trim();
    if (!phone) { $('loginErr').textContent = 'יש להקליד מספר טלפון'; return; }
    $('loginBtn').disabled = true;
    $('loginErr').textContent = '';
    call('login', phone).then(r => {
      S.token = r.token; store.set('beitor.token', r.token);
      S.guest = false; store.del('beitor.guest');
      $('loginPhone').value = '';
      startApp();
    }).catch(e => { $('loginErr').textContent = errMsg(e); })
      .finally(() => { $('loginBtn').disabled = false; });
  });

  $('guestEntry').addEventListener('click', () => {
    S.guest = true; store.set('beitor.guest', '1');
    location.hash = '#/';
    startApp();
  });

  $('adminEntry').addEventListener('click', () => { $('adminCode').value = ''; $('adminDlg').showModal(); });
  $('adminForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    ev.preventDefault();
    const code = $('adminCode').value.trim();
    const prev = S.adminCode;
    S.adminCode = code;
    call('adminLogin').then(data => {
      store.sset('beitor.admin', code);
      S.adminData = data;
      $('adminDlg').close();
      location.hash = '#/admin';
      startApp();
    }).catch(e => { S.adminCode = prev; toast(errMsg(e), true); });
  });

  function logout() {
    const done = () => { handleAuthLost(); location.hash = '#/'; };
    if (S.token) call('logout').then(done, done); else done();
  }

  /* ---------- App shell & routing ---------- */
  function route() { return (location.hash.replace(/^#\/?/, '') || 'schedule'); }

  function startApp() {
    $('loginView').hidden = true;
    $('app').hidden = false;
    refresh().then(() => render());
  }

  function refresh() {
    return call('getState').then(data => {
      S.data = data;
      S.me = data.me;
      S.index = {};
      data.bookings.forEach(b => { S.index[b.date + '|' + b.lesson] = b; });
      $('spaceName').textContent = data.config.spaceName;
      $('schoolName').textContent = data.config.schoolName;
      if (route() === 'schedule') render();
    }).catch(e => { if (loggedIn()) toast(errMsg(e), true); });
  }

  window.addEventListener('hashchange', () => { if (S.data) render(); });

  function render() {
    if (!S.data) return;
    let r = route();
    if ((r === 'admin' && !S.adminCode) || (r === 'feedback' && isGuest())) { location.hash = '#/'; return; }
    $('loading').hidden = true;
    $('navAdmin').hidden = !S.adminCode;
    $('navFeedback').hidden = isGuest();
    Array.prototype.forEach.call($('nav').querySelectorAll('a'), a => {
      const target = a.getAttribute('href').replace(/^#\/?/, '') || 'schedule';
      if (target === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    fill($('meBox'),
      S.me ? h('span', null, 'שלום, ', h('b', null, S.me.name)) : h('span', null, isGuest() ? 'צפייה כאורח' : 'הנהלה'),
      h('button', { class: 'pill', type: 'button', onclick: logout }, isGuest() ? 'כניסה' : 'יציאה'));
    $('scheduleView').hidden = r !== 'schedule';
    $('feedbackView').hidden = r !== 'feedback';
    $('adminView').hidden = r !== 'admin';
    if (r === 'schedule') renderSchedule();
    else if (r === 'feedback') { if (S.fb) renderFeedback(); loadFeedback(); }
    else if (r === 'admin') { if (S.adminData) renderAdmin(); else loadAdmin(); }
  }

  /* ---------- Schedule ---------- */
  function weeksOf(w) {
    const out = [];
    for (let s = w.start; s <= w.last; s = addDays(s, 7)) out.push(s);
    return out;
  }
  function weekTitleFrom(cal, ws) {
    cal = cal || {};
    const sat = addDays(ws, 6);
    const p = (cal.parashot || {})[sat];
    if (p) return p;
    const hol = (cal.holidays || {})[sat];
    if (hol && hol.length) return hol[0];
    return 'שבוע ' + fmtShort(ws);
  }
  function weekTitle(ws) { return weekTitleFrom(S.data.calendar, ws); }
  function dayStatus(date) {
    const w = S.data.window, cfg = S.data.config;
    if (date < w.today) return 'past';
    if (cfg.closedDates[date]) return 'closed';
    if (date > w.last) return 'locked';
    return 'open';
  }
  function lessonById(lessons, id) {
    return lessons.find(x => x.id === Number(id)) || { id: id, name: 'שעה ' + id, time: '' };
  }
  function lessonName(id) { return lessonById(S.data.config.lessons, id).name; }

  function renderSchedule() {
    const d = S.data, w = d.window;
    const weeks = weeksOf(w);
    if (S.weekIdx == null || S.weekIdx >= weeks.length) S.weekIdx = 0;

    const limit = S.me && !S.adminCode ? S.me.weeklyLimit : 0;
    fill($('intro'),
      h('span', null, isGuest() ? 'צפייה בלוח השיבוצים של המרחב (ללא אפשרות עריכה).' : (S.adminCode ? 'בחרי שיעור פנוי כדי לשבץ אליו מורה.' : 'בחרי שיעור פנוי כדי להשתבץ למרחב.')),
      limit ? h('span', null, 'אפשר להשתבץ עד ', h('strong', null, (limit === 1 ? 'שעה אחת' : limit + ' שעות') + ' בשבוע'), '.') : null);

    const mine = d.bookings.filter(b => b.mine && b.date >= w.today)
      .sort((a, b) => (a.date + a.lesson).localeCompare(b.date + b.lesson));
    $('mineStrip').hidden = !mine.length;
    fill($('mineStrip'),
      h('h2', null, 'השיבוצים הקרובים שלי:'),
      mine.map(b => h('button', {
        class: 'mine-chip', type: 'button',
        onclick: () => { S.weekIdx = weeks.findIndex(ws => b.date >= ws && b.date < addDays(ws, 7)); renderSchedule(); },
      }, h('b', null, dateEl(b.date)), ' · ' + lessonName(b.lesson) + ' · ' + b.className)));

    fill($('tabs'), weeks.map((ws, i) => {
      const isThis = w.today >= ws && w.today < addDays(ws, 7);
      const kicker = isThis ? 'השבוע' : (i === 0 ? 'השבוע הקרוב' : (i === 1 ? 'שבוע הבא' : (i === 2 ? 'בעוד שבועיים' : 'בעוד ' + i + ' שבועות')));
      const fri = addDays(ws, 5);
      return h('button', {
        class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(i === S.weekIdx),
        onclick: () => { S.weekIdx = i; renderSchedule(); },
      },
        h('div', { class: 't-kicker' }, kicker),
        h('div', { class: 't-title' }, weekTitle(ws)),
        h('div', { class: 't-sub' }, hebDate(ws) + ' – ' + hebDate(fri), h('small', { class: 'greg' }, fmtShort(ws) + '–' + fmtShort(fri))),
        limit ? h('div', { class: 't-quota' + (myCount(ws) >= limit ? ' full' : '') }, 'השיבוצים שלך: ' + myCount(ws) + ' מתוך ' + limit) : null);
    }));

    fill($('week'), renderWeek(weeks[S.weekIdx]));

    const pws = weeks[S.weekIdx];
    fill($('printTitle'), h('h2', null, d.config.spaceName + ' · ' + weekTitle(pws)),
      h('span', null, hebDate(pws) + ' – ' + hebDate(addDays(pws, 5)) + '  (' + fmtShort(pws) + '–' + fmtShort(addDays(pws, 5)) + ') · ' + d.config.schoolName));

    const notices = d.notices || [];
    $('notices').hidden = !notices.length;
    fill($('notices'), notices.map(n => h('div', { class: 'n-row' }, h('span', null, '🔔'), h('span', null, n.text))),
      notices.length ? h('button', { class: 'btn small', type: 'button', onclick: () => call('markNoticesRead').then(refresh, e => toast(errMsg(e), true)) }, 'הבנתי') : null);
  }

  function myCount(ws) {
    const we = addDays(ws, 6);
    return S.data.bookings.filter(b => b.mine && b.date >= ws && b.date <= we).length;
  }
  function quotaFull(date) {
    const limit = S.me && !S.adminCode ? S.me.weeklyLimit : 0;
    return !!limit && myCount(addDays(date, -dow(date))) >= limit;
  }

  function renderWeek(ws) {
    const d = S.data, cfg = d.config, w = d.window;
    const grid = h('div', { class: 'grid', style: '--days:' + cfg.schoolDays.length + ';--lessons:' + cfg.lessons.length });
    grid.append(h('div', { class: 'lesson-col', 'aria-hidden': 'true' },
      h('div', null),
      cfg.lessons.map(l => h('div', { class: 'lesson-label' }, h('strong', null, l.name), l.time ? h('span', null, l.time) : null))));

    cfg.schoolDays.forEach(dw => {
      const date = addDays(ws, dw);
      const st = dayStatus(date);
      const hol = ((d.calendar || {}).holidays || {})[date] || [];
      const closed = cfg.closedDates[date];
      grid.append(h('section', { class: 'day is-' + st + (date === w.today ? ' is-today' : ''), 'aria-label': fmtLong(date) },
        h('header', { class: 'day-head' },
          h('div', { class: 'day-name' }, 'יום ' + DAY_NAMES[dw], date === w.today ? h('span', { class: 'badge' }, 'היום') : null),
          h('div', { class: 'day-date' }, h('span', { class: 'heb' }, hebDate(date)), h('small', { class: 'greg' }, fmtShort(date))),
          (hol.length || closed) ? h('div', { class: 'chips' },
            closed ? h('span', { class: 'chip closed' }, closed) : null,
            hol.filter(t => t !== closed).map(t => h('span', { class: 'chip' }, t))) : null,
          st === 'locked' ? h('div', { class: 'day-note' }, 'ייפתח להרשמה ב־' + fmtLong(addDays(date, -cfg.daysAhead)).replace(/^יום /, '')) : null,
          st === 'past' ? h('div', { class: 'day-note' }, 'עבר') : null,
          st === 'closed' ? h('div', { class: 'day-note' }, 'המרחב סגור') : null),
        cfg.lessons.map(l => {
          const max = (cfg.lessonsByDay || {})[dw];
          return max != null && l.id > max && !S.index[date + '|' + l.id] ? h('div', { class: 'slot none', 'aria-hidden': 'true' }) : renderSlot(date, l, st);
        })));
    });
    return grid;
  }

  function renderSlot(date, l, st) {
    const b = S.index[date + '|' + l.id];
    const today = S.data.window.today;
    const label = h('span', { class: 'slot-label' }, l.name);
    if (b) {
      const manage = b.mine || !!S.adminCode;
      const canCancel = manage && date >= today;
      const canFeedback = manage && date <= today && !b.hasFeedback;
      const wl = (S.data.waitlist || {})[date + '|' + l.id];
      const canWait = st === 'open' && S.me && !b.mine;
      return h('div', { class: 'slot taken' + (b.mine ? ' mine' : ''), style: teacherColor(b.teacher) },
        label,
        h('div', { class: 'who' }, h('strong', null, b.teacher), h('span', { class: 'cls' }, b.className)),
        b.fixed ? h('span', { class: 'fixed-tag', title: 'שיבוץ קבוע שקבעה ההנהלה' }, 'קבוע') : null,
        b.topic ? h('div', { class: 'topic', title: b.topic }, b.topic) : null,
        wl && wl.mine ? h('div', { class: 'wait' }, '⏳ את ברשימת ההמתנה (מקום ', h('b', null, wl.pos), ') · ',
          h('button', { class: 'link-btn', type: 'button', onclick: () => leaveWait(wl.mine) }, 'יציאה'))
          : (wl && st === 'open' ? h('div', { class: 'wait' }, '⏳ ' + (wl.count === 1 ? 'ממתינה אחת' : wl.count + ' ממתינות')) : null),
        canWait && !(wl && wl.mine) ? h('div', { class: 'slot-actions' },
          h('button', { class: 'link-btn wait-btn', type: 'button', onclick: () => openBook(date, l, true) }, '+ רשימת המתנה')) : null,
        (canCancel || canFeedback || b.hasFeedback) ? h('div', { class: 'slot-actions' },
          canFeedback ? h('button', { class: 'link-btn fb', type: 'button', onclick: () => openFeedback(b) }, '✎ כתיבת משוב') : null,
          b.hasFeedback ? h('a', { class: 'link-btn fb', href: '#/feedback', onclick: () => { S.flashId = b.id; } }, '💬 משוב') : null,
          canCancel ? h('button', { class: 'link-btn', type: 'button', onclick: () => askCancel(b) }, 'ביטול שיבוץ') : null) : null);
    }
    const blocked = (S.data.config.blockedSlots || {})[date + '|' + l.id];
    if (blocked && (st === 'open' || st === 'locked')) {
      if (S.adminCode && st === 'open') {
        return h('button', { class: 'slot blocked', type: 'button', title: 'חסום לשיבוץ – כהנהלה אפשר לשבץ בכל זאת', onclick: () => openBook(date, l) }, label, h('b', null, 'לא זמין'), h('span', null, blocked));
      }
      return h('div', { class: 'slot blocked' }, label, h('b', null, 'לא זמין'), h('span', null, blocked));
    }
    if (st === 'open' && isGuest()) return h('div', { class: 'slot empty' }, label, 'פנוי');
    if (st === 'open' && quotaFull(date)) return h('div', { class: 'slot full', title: 'הגעת למכסת השעות השבועית' }, label, 'פנוי · הגעת למכסה');
    if (st === 'open') {
      return h('button', {
        class: 'slot free', type: 'button', onclick: () => openBook(date, l),
        'aria-label': (S.adminCode ? 'לשבץ ל' : 'להשתבץ ל') + l.name + ' ב' + fmtLong(date),
      }, label, h('span', { class: 'free-cta' }, S.adminCode ? '+ לשבץ' : '+ להשתבץ'));
    }
    return h('div', { class: 'slot empty' }, label, st === 'past' ? '—' : '');
  }

  /* ---------- Booking ---------- */
  let pending = null;
  function openBook(date, l, wait) {
    pending = { date: date, lesson: l.id, wait: !!wait };
    $('bookTitle').textContent = wait ? 'הצטרפות לרשימת המתנה' : (S.adminCode ? 'שיבוץ מורה לשיעור' : 'השתבצות לשיעור');
    $('bookNote').hidden = !wait;
    $('bookNote').textContent = 'השיעור תפוס כרגע. אם הוא יתפנה – תשובצי אליו אוטומטית לפי סדר ההצטרפות, ותקבלי הודעה כאן באתר.';
    $('bookSubmit').textContent = wait ? 'הצטרפות להמתנה' : 'שיבוץ';
    $('bookSummary').textContent = fmtLong(date) + ' · ' + l.name + (l.time ? ' ' + l.time : '') + ' · ' + weekTitle(addDays(date, -dow(date)));
    const pickTeacher = !!S.adminCode && !wait;
    $('bTeacherWrap').hidden = !pickTeacher;
    $('bTeacher').required = pickTeacher;
    if (pickTeacher) {
      fill($('bTeacher'), h('option', { value: '' }, 'בחרי מורה…'), S.data.teachers.map(t => h('option', { value: t.id }, t.name)));
      $('bTeacher').value = S.me ? S.me.id : '';
    }
    let classes = [];
    try { classes = JSON.parse(store.get('beitor.classes') || '[]'); } catch (e) { /* ignore */ }
    fill($('classList'), classes.map(c => h('option', { value: c })));
    $('bClass').value = classes[0] || '';
    $('bTopic').value = '';
    $('bookSubmit').disabled = false;
    $('bookDlg').showModal();
  }

  $('bookForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;
    ev.preventDefault();
    const className = $('bClass').value.trim();
    const req = { date: pending.date, lesson: pending.lesson, className: className, topic: $('bTopic').value.trim() };
    if (S.adminCode && !pending.wait) req.teacherId = $('bTeacher').value;
    $('bookSubmit').disabled = true;
    call(pending.wait ? 'joinWaitlist' : 'book', req).then(() => {
      let classes = [];
      try { classes = JSON.parse(store.get('beitor.classes') || '[]'); } catch (e) { /* ignore */ }
      store.set('beitor.classes', JSON.stringify([className].concat(classes.filter(c => c !== className)).slice(0, 8)));
      $('bookDlg').close();
      toast(pending.wait ? 'נוספת לרשימת ההמתנה ⏳' : (S.adminCode ? 'השיבוץ נקלט ✓' : 'השתבצת בהצלחה! נתראה בבית אור ✨'));
      return refresh();
    }).catch(e => {
      $('bookSubmit').disabled = false;
      toast(errMsg(e), true);
      if (/תפוסה/.test(errMsg(e))) { $('bookDlg').close(); refresh(); }
    });
  });

  function leaveWait(id) {
    call('leaveWaitlist', id).then(() => { toast('יצאת מרשימת ההמתנה'); return refresh(); }).catch(e => toast(errMsg(e), true));
  }

  $('printBtn').addEventListener('click', () => window.print());

  function askCancel(b) {
    confirmBox('לבטל את השיבוץ?', fmtLong(b.date) + ' · ' + lessonName(b.lesson) + ' · ' + b.teacher + ' · ' + b.className, 'כן, לבטל')
      .then(ok => {
        if (!ok) return;
        call('cancel', b.id).then(() => { toast('השיבוץ בוטל'); S.adminData = null; return refresh(); })
          .catch(e => toast(errMsg(e), true));
      });
  }

  /* ---------- Feedback ---------- */
  let fbTarget = null, fbRating = 0;
  function renderRate() {
    fill($('fbRate'), [1, 2, 3, 4, 5].map(n => h('button', {
      type: 'button', class: n <= fbRating ? 'on' : '', role: 'radio', 'aria-checked': String(n === fbRating), 'aria-label': n + ' כוכבים',
      onclick: () => { fbRating = fbRating === n ? 0 : n; renderRate(); },
    }, '★')));
  }
  function openFeedback(b) {
    fbTarget = b;
    const lessons = (S.fb && S.fb.lessons) || (S.data && S.data.config.lessons) || [];
    $('fbSummary').textContent = fmtLong(b.date) + ' · ' + lessonById(lessons, b.lesson).name + ' · ' + b.className + (b.topic ? ' · ' + b.topic : '') + (S.me && b.teacher === S.me.name ? '' : ' · ' + b.teacher);
    fbRating = (b.feedback && b.feedback.rating) || 0;
    renderRate();
    $('fbText').value = (b.feedback && b.feedback.text) || '';
    $('fbDelete').hidden = !(b.feedback && b.feedback.text);
    $('fbSubmit').disabled = false;
    resetFbTools();
    $('fbDlg').showModal();
  }

  /* ----- Voice dictation (browser speech recognition, Hebrew) ----- */
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, fbPrevDraft = null, aiQuestions = [];
  function aiOn() { return !!((S.fb && S.fb.ai) || (S.data && S.data.config.ai) || (S.adminData && S.adminData.ai)); }
  function resetFbTools() {
    stopRec();
    $('fbMic').hidden = !SpeechRec;
    $('fbMicHint').textContent = SpeechRec ? '' : 'אפשר להכתיב בקול: לחצי על המיקרופון במקלדת של הטלפון.';
    $('fbAi').hidden = !aiOn();
    $('fbAi').disabled = false;
    $('fbAi').textContent = '✨ עזרה בניסוח';
    $('fbUndo').hidden = true;
    $('fbAiBox').hidden = true;
    fbPrevDraft = null; aiQuestions = [];
  }
  function stopRec() {
    if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } }
  }
  $('fbMic').addEventListener('click', () => {
    if (rec) { stopRec(); return; }
    const ta = $('fbText');
    let base = ta.value.trim();
    rec = new SpeechRec();
    rec.lang = 'he-IL';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (ev) => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) base = (base ? base + ' ' : '') + t.trim();
        else interim += t;
      }
      ta.value = base + (interim ? ' ' + interim : '');
    };
    rec.onerror = (ev) => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') toast('אין הרשאה למיקרופון. אפשר לאשר בהגדרות הדפדפן', true);
      else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('ההקלטה נעצרה, נסי שוב', true);
    };
    rec.onend = () => { ta.value = base; rec = null; $('fbMic').classList.remove('rec'); $('fbMic').textContent = '🎤 הקלטה'; };
    try {
      rec.start();
      $('fbMic').classList.add('rec');
      $('fbMic').textContent = '⏹ עצירה';
      $('fbMicHint').textContent = 'מדברים בחופשיות – מה עשיתן, מה עבד, מה הייתן משנות. אחר כך אפשר ללחוץ "עזרה בניסוח".';
    } catch (e) { rec = null; toast('לא ניתן להתחיל הקלטה', true); }
  });
  $('fbDlg').addEventListener('close', stopRec);

  /* ----- AI help: follow-up questions, then a composed draft ----- */
  function aiBusy(on, label) {
    $('fbAi').disabled = on;
    $('fbAi').textContent = on ? '✨ ' + (label || 'חושבת…') : '✨ עזרה בניסוח';
    const go = document.getElementById('aiCompose');
    if (go) go.disabled = on;
  }
  $('fbAi').addEventListener('click', () => {
    stopRec();
    const draft = $('fbText').value.trim();
    if (!draft) { toast('כתבי או הקליטי כמה מילים על השיעור, ואז אעזור להשלים', true); return; }
    aiBusy(true);
    call('feedbackAssist', { id: fbTarget.id, step: 'questions', draft: draft }).then(r => {
      aiBusy(false);
      aiQuestions = r.questions || [];
      if (!aiQuestions.length) return compose();
      const inputs = aiQuestions.map(() => h('textarea', { rows: 2, maxlength: 1000 }));
      fill($('fbAiBox'),
        h('p', null, 'כדי שהמשוב יעזור למורות אחרות – עוד ' + (aiQuestions.length === 1 ? 'שאלה קטנה' : 'שתי שאלות קטנות') + ' (אפשר לדלג):'),
        aiQuestions.map((q, i) => h('label', null, q, inputs[i])),
        h('div', { class: 'dlg-actions' },
          h('button', { class: 'btn primary small', type: 'button', id: 'aiCompose', onclick: () => compose(inputs.map((inp, i) => ({ q: aiQuestions[i], a: inp.value.trim() }))) }, '✨ סידור המשוב'),
          h('button', { class: 'btn small', type: 'button', onclick: () => compose([]) }, 'דלגי וסדרי')));
      $('fbAiBox').hidden = false;
      inputs[0].focus();
    }).catch(e => { aiBusy(false); toast(errMsg(e), true); });
  });
  function compose(answers) {
    const draft = $('fbText').value.trim();
    aiBusy(true, 'מנסחת…');
    return call('feedbackAssist', { id: fbTarget.id, step: 'compose', draft: draft, answers: answers || [] }).then(r => {
      aiBusy(false);
      fbPrevDraft = draft;
      $('fbText').value = r.text;
      $('fbAiBox').hidden = true;
      $('fbUndo').hidden = false;
      toast('הנה הנוסח – אפשר לערוך לפני הפרסום');
    }).catch(e => { aiBusy(false); toast(errMsg(e), true); });
  }
  $('fbUndo').addEventListener('click', () => {
    if (fbPrevDraft == null) return;
    $('fbText').value = fbPrevDraft;
    fbPrevDraft = null;
    $('fbUndo').hidden = true;
  });
  function saveFeedback(text) {
    $('fbSubmit').disabled = true;
    return call('saveFeedback', { id: fbTarget.id, text: text, rating: fbRating }).then(data => {
      S.fb = data;
      $('fbDlg').close();
      toast(route() === 'admin' ? (text ? 'המשוב עודכן' : 'המשוב נמחק') : (text ? 'המשוב פורסם – תודה! 🙏' : 'המשוב נמחק'));

  }
  $('fbForm').addEventListener('submit', (ev) => {
    if (ev.submitter && ev.submitter.value !== 'ok') return;

  });
  $('fbDelete').addEventListener('click', () => {

  function loadFeedback() {

      .catch(e => toast(errMsg(e), true));

  /** Feedback text with the AI section headings ("מה עשינו:" …) in bold. */
  function fbTextNodes(text) {
    return text.split('\n').map((line, i) => [i ? '\n' : '',
      /^(מה עשינו|מה עבד|מה כדאי לשפר|טיפ למורות):\s*$/.test(line.trim()) ? h('b', null, line) : line]);
  }

  function stars(n) {
    if (!n) return null;
    return h('span', { class: 'stars', 'aria-label': n + ' מתוך 5' }, '★'.repeat(n), h('span', { class: 'off' }, '★'.repeat(5 - n)));
  }

  function renderFeedback() {

    const myPending = F.pending.filter(b => b.mine || (!S.me && S.adminCode));

    teacherSel.value = f.teacher;
    const search = h('input', { type: 'search', placeholder: 'חיפוש: נושא, כיתה, פרשה…', value: f.q, 'aria-label': 'חיפוש' });
    search.addEventListener('input', () => {
      f.q = search.value;
      clearTimeout(search._t);
      search._t = setTimeout(() => { renderFeedback(); const s = root.querySelector('input[type=search]'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250);
    });

    fill(root,
      h('h2', { class: 'page-title' }, 'משובים מהשיעורים בבית אור'),

      myPending.length ? [
        h('h3', { class: 'section-title' }, S.me ? 'שיעורים שלך שממתינים למשוב' : 'שיעורים שממתינים למשוב'),
        h('div', { class: 'fb-pending' }, myPending.map(b => h('div', { class: 'fb-pend-card' },
          h('div', null, h('b', null, dateEl(b.date)), ' · ' + lessonById(F.lessons, b.lesson).name),
          h('div', { class: 'fb-meta' }, (S.me ? '' : b.teacher + ' · ') + b.className + (b.topic ? ' · ' + b.topic : '')),
          h('button', { class: 'btn primary', type: 'button', onclick: () => openFeedback(b) }, '✎ כתיבת משוב')))),
      ] : null,

      h('h3', { class: 'section-title' }, 'כל המשובים', F.feed.length ? h('span', { class: 'hint' }, '  (' + F.feed.length + ')') : null),
      F.feed.length ? h('div', { class: 'filters' }, teacherSel, search) : null,
      f.tag ? h('div', { style: 'margin:-6px 0 14px' }, h('span', { class: 'tag-filter' }, 'מסונן לפי: ', h('b', null, f.tag),

      feed.length ? h('div', { class: 'fb-feed' }, feed.map(b => {
        const fb = b.feedback;

        return h('article', { class: 'fb-card' + (S.flashId === b.id ? ' flash' : ''), id: 'fb-' + b.id, style: teacherColor(b.teacher) },
          h('div', { class: 'fb-week' }, weekTitleFrom(F.calendar, addDays(b.date, -dow(b.date)))),
          h('div', { class: 'fb-who' }, h('strong', null, b.teacher), h('span', { class: 'fb-meta' }, b.className)),
          h('div', { class: 'fb-meta' }, dateEl(b.date), ' · ' + lessonById(F.lessons, b.lesson).name),
          b.topic ? h('div', { class: 'fb-topic' }, b.topic) : null,
          stars(fb.rating),

    if (S.flashId) {

  }

  /* ---------- Admin ---------- */
  function loadAdmin() {
    return call('adminLogin').then(data => { S.adminData = data; if (route() === 'admin') renderAdmin(); })
      .catch(e => toast(errMsg(e), true));
  }
  function adminUpdate(promise, msg) {
    return promise.then(data => {
      S.adminData = data;
      renderAdmin();
      if (msg) toast(msg);
      refresh();
      return data;
    }).catch(e => { toast(errMsg(e), true); throw e; });
  }

  function renderAdmin() {
    const A = S.adminData, root = $('adminView');
    if (!A) { fill(root, h('div', { class: 'loading' }, 'טוען…')); return; }
    const tabs = h('div', { class: 'admin-tabs', role: 'tablist' },
      [['teachers', 'מורות וטלפונים'], ['settings', 'תאריכים וימי חופש'], ['series', 'שיבוצים קבועים'], ['bookings', 'כל השיבוצים'], ['feedback', 'משובים']].map(t => h('button', {
        type: 'button', role: 'tab', 'aria-selected': String(S.adminTab === t[0]),
        onclick: () => { S.adminTab = t[0]; renderAdmin(); },
      }, t[1])));
    const body = S.adminTab === 'teachers' ? renderTeachersAdmin(A) : S.adminTab === 'settings' ? renderSettingsAdmin(A)
      : S.adminTab === 'series' ? renderSeriesAdmin(A) : S.adminTab === 'feedback' ? renderFeedbackAdmin(A) : renderBookingsAdmin(A);
    fill(root, tabs, body);
  }

  function renderTeachersAdmin(A) {
    const upcoming = {}, total = {};
    A.bookings.forEach(b => {
      total[b.teacher] = (total[b.teacher] || 0) + 1;
      if (b.date >= A.today) upcoming[b.teacher] = (upcoming[b.teacher] || 0) + 1;
    });
    const bulk = h('textarea', { rows: 6, placeholder: 'רחל כהן, 050-1234567\nמרים לוי, 052-7654321\n…', style: 'direction:rtl' });
    const bulkResult = h('div');
    return h('div', { class: 'panel' },
      h('div', { class: 'head-row' },
        h('div', null, h('h2', null, 'רשימת המורות'),
          h('p', { class: 'muted', style: 'margin:0' }, 'כל מורה נכנסת לאתר עם מספר הטלפון שלה. מורה לא פעילה לא יכולה להיכנס.')),
        h('button', { class: 'btn primary', type: 'button', onclick: () => editTeacher(null) }, '+ הוספת מורה')),
      h('div', { class: 'stats' },
        h('div', { class: 'stat' }, h('b', null, A.teachers.filter(t => t.active).length), h('span', null, 'מורות פעילות')),
        h('div', { class: 'stat' }, h('b', null, A.bookings.filter(b => b.date >= A.today).length), h('span', null, 'שיבוצים עתידיים')),
        h('div', { class: 'stat' }, h('b', null, A.bookings.filter(b => b.hasFeedback).length), h('span', null, 'משובים (60 יום)'))),
      A.teachers.length ? h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['שם', 'טלפון', 'סטטוס', 'מכסה שבועית', 'שיבוצים קרובים', 'סה״כ (60 יום)', ''].map(x => h('th', null, x)))),
        h('tbody', null, A.teachers.slice().sort((a, b) => a.name.localeCompare(b.name, 'he')).map(t => h('tr', { class: t.active ? '' : 'inactive' },
          h('td', null, h('strong', null, t.name)),
          h('td', { class: 'ltr' }, fmtPhone(t.phone)),
          h('td', null, t.active ? 'פעילה' : 'לא פעילה'),
          h('td', null, t.weeklyLimit ? h('b', null, t.weeklyLimit + ' שעות') : h('span', { class: 'hint' }, A.settings.weeklyLimit ? 'כללית (' + A.settings.weeklyLimit + ')' : 'ללא הגבלה')),
          h('td', { class: 'num' }, upcoming[t.name] || 0),
          h('td', { class: 'num' }, total[t.name] || 0),
          h('td', null, h('div', { class: 'actions' },
            h('button', { class: 'link', type: 'button', onclick: () => { S.adminTab = 'bookings'; S.adminFilter.teacher = t.name; renderAdmin(); } }, 'שיבוצים'),
            h('button', { class: 'link', type: 'button', onclick: () => editTeacher(t) }, 'עריכה'),
            h('button', { class: 'link danger', type: 'button', onclick: () => deleteTeacher(t) }, 'מחיקה'))))))))
        : h('p', { class: 'empty-msg' }, 'עדיין אין מורות ברשימה. הוסיפי אחת־אחת, או הדביקי רשימה למטה.'),
      h('details', { open: A.teachers.length ? null : true },
        h('summary', null, 'הדבקת רשימת מורות'),
        h('div', { style: 'display:flex;flex-direction:column;gap:10px;margin-top:10px;max-width:460px' },
          h('label', null, 'כל מורה בשורה: שם, ואחריו מספר טלפון', bulk),
          h('div', null, h('button', {
            class: 'btn primary', type: 'button',
            onclick: () => {
              const lines = bulk.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
              if (!lines.length) { toast('אין שורות להוספה', true); return; }
              call('adminAddTeachers', lines).then(data => {
                S.adminData = data;
                renderAdmin();
                refresh();
                toast('נוספו ' + data.added + ' מורות');
                if (data.errors && data.errors.length) {
                  const panel = $('adminView').querySelector('details');

  let editingTeacher = null;
  function editTeacher(t) {
    editingTeacher = t;
    $('teacherDlgTitle').textContent = t ? 'עריכת מורה' : 'מורה חדשה';
    $('tName').value = t ? t.name : '';

  $('teacherForm').addEventListener('submit', (ev) => {

  function deleteTeacher(t) {

      .then(ok => { if (ok) adminUpdate(call('adminDeleteTeacher', t.id), 'נמחקה').catch(() => {}); });
  }

  function renderSettingsAdmin(A) {
    const st = A.settings;
    const save = (fields, msg) => adminUpdate(call('adminSaveSettings', fields), msg || 'נשמר').catch(() => {});
    const dayShort = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳'];
    const perDaySummary = (() => {
      const groups = [];
      [0, 1, 2, 3, 4, 5].forEach(d => {
        const n = A.lessonsByDay[d], g = groups[groups.length - 1];
        if (g && g.n === n) g.to = d; else groups.push({ from: d, to: d, n: n });
      });
      return groups.map(g => (g.from === g.to ? dayShort[g.from] : dayShort[g.from] + '–' + dayShort[g.to]) + ': ' + g.n).join(' · ');
    })();
    const upcomingBlocks = st.blockedSlots.filter(b => b.date >= A.today).length;
    const upcomingVac = st.vacations.filter(v => v.to >= A.today).length;
    const timesSet = (st.lessonTimes || []).filter(Boolean).length;

    const SECTIONS = [
      { key: 'period', title: 'תקופת הפעילות', c: 'petrol',
        sum: st.startDate || st.endDate ? (st.startDate ? fmtShortHeb(st.startDate) : '…') + ' – ' + (st.endDate ? fmtShortHeb(st.endDate) : '…') : 'ללא הגבלה', render: periodSection },
      { key: 'perday', title: 'שעות בכל יום', c: 'powder', sum: perDaySummary, render: perDaySection },
      { key: 'times', title: 'זמני השעות', c: 'sage', sum: timesSet ? 'הוגדרו ' + timesSet + ' שעות' : 'לא הוגדרו', render: timesSection },
      { key: 'ahead', title: 'הרשמה מראש', c: 'cream', sum: (st.daysAhead || A.defaultDaysAhead) + ' ימים קדימה', render: aheadSection },
      { key: 'limit', title: 'מגבלת שעות שבועית', c: 'slate', sum: st.weeklyLimit ? st.weeklyLimit + ' שעות לכל מורה' : 'ללא הגבלה', render: limitSection },
      { key: 'blocks', title: 'חסימת שעות ביום', c: 'rose', sum: upcomingBlocks ? (upcomingBlocks === 1 ? 'יום אחד עם חסימות' : upcomingBlocks + ' ימים עם חסימות') : 'אין חסימות', render: () => renderBlocksPanel(A) },
      { key: 'vacations', title: 'ימי חופש', c: 'olive', sum: upcomingVac ? (upcomingVac === 1 ? 'חופשה קרובה אחת' : upcomingVac + ' חופשות קרובות') : 'לא הוגדרו', render: vacationsSection },
    ];
    const open = SECTIONS.find(x => x.key === S.settingsOpen);

    return h('div', null,
      h('div', { class: 'set-tiles' }, SECTIONS.map(x => h('button', {
        type: 'button', class: 'set-tile', style: '--c: var(--c-' + x.c + ')', 'aria-expanded': String(open === x),
        onclick: () => { S.settingsOpen = open === x ? null : x.key; renderAdmin(); },
      }, h('span', { class: 'set-title' }, x.title), h('span', { class: 'set-sum' }, x.sum)))),
      open ? open.render() : h('p', { class: 'empty-msg' }, 'בחרי נושא כדי לערוך אותו.'));

    function section(title, desc, body, onSave) {
      return h('div', { class: 'panel set-panel' },
        h('h2', null, title),
        desc ? h('p', { class: 'muted' }, desc) : null,
        body,
        onSave ? h('div', { style: 'margin-top:14px' }, h('button', { class: 'btn primary', type: 'button', onclick: onSave }, 'שמירה')) : null);
    }

    function periodSection() {

          h('td', { style: 'white-space:nowrap' }, dateEl(b.date)),
          h('td', null, lessonById(lessons, b.lesson).name),
          h('td', null, b.teacher),
          h('td', null, b.className),
          h('td', null, b.topic || h('span', { class: 'hint' }, '—')),
          h('td', null, b.hasFeedback ? '✓' : h('span', { class: 'hint' }, '—')),
          h('td', null, b.date >= A.today ? h('div', { class: 'actions' }, h('button', {
            class: 'link danger', type: 'button',
            onclick: () => confirmBox('לבטל את השיבוץ?', b.teacher + ' · ' + fmtLong(b.date) + ' · ' + lessonById(lessons, b.lesson).name, 'כן, לבטל')
              .then(ok => { if (ok) adminUpdate(call('adminCancel', b.id), 'השיבוץ בוטל').catch(() => {}); }),
          }, 'ביטול')) : null))))))
        : h('p', { class: 'empty-msg' }, 'אין שיבוצים להצגה.'));
  }

  /* ---------- Start ---------- */
  if (loggedIn()) startApp(); else showLogin();
  setInterval(() => {
    if (document.visibilityState === 'visible' && loggedIn() && route() === 'schedule' && !document.querySelector('dialog[open]')) refresh();
  }, 60000);
})();
</script>
</body>
</html>
